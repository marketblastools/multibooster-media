<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Up Saldo - Partnership Global Media</title>
  <style>
    :root {
      --bg-color: #07111f;
      --card-bg: #0d1d30;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #eaf2ff;
      --text-muted: #8ea2bd;
      --accent: #00d4ff;
      --accent-hover: #00bfe9;
      --success: #27e889;
      --danger: #ff5252;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .topup-wrapper {
      width: 90%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .topup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .topup-header h2 {
      font-size: 18px;
      margin: 0;
      color: #fff;
    }

    .back-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    /* Informasi Saldo Saat Ini */
    .balance-card {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    .balance-card span { font-size: 11px; color: var(--text-muted); display: block; margin-bottom: 4px; }
    .balance-card h3 { font-size: 20px; margin: 0; color: var(--success); }

    /* Form Group */
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: bold;
    }
    .form-group input {
      width: 100%;
      padding: 11px;
      background: #050d18;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    .form-group input:focus { border-color: var(--accent); }

    /* Tombol Aksi */
    .btn-action {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #00bfe9, #6857ff);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,190,240,0.2);
      transition: 0.2s;
    }
    .btn-action:hover { transform: translateY(-2px); }

    /* Tampilan Langkah Pembayaran & Rekening */
    .payment-box {
      background: #050d18;
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: center;
    }
    .payment-box p { font-size: 12px; color: var(--text-muted); margin: 4px 0; }
    .payment-box strong { color: #fff; font-size: 15px; }

    .hidden { display: none !important; }

    /* Animasi Ceklis Sukses */
    .success-container { text-align: center; padding: 20px 0; }
    .success-checkmark { width: 60px; height: 60px; margin: 0 auto 15px; position: relative; }
    .success-checkmark .check-icon { width: 60px; height: 60px; position: relative; border-radius: 50%; box-sizing: content-box; border: 3px solid var(--success); }
    .success-checkmark .check-icon .icon-line { height: 3px; background-color: var(--success); display: block; position: absolute; z-index: 10; border-radius: 2px; }
    .success-checkmark .check-icon .icon-line.line-tip { top: 34px; left: 10px; width: 18px; transform: rotate(45deg); }
    .success-checkmark .check-icon .icon-line.line-long { top: 28px; left: 22px; width: 28px; transform: rotate(-45deg); }
  </style>
</head>
<body>

  <div class="topup-wrapper">
    <div class="topup-header">
      <h2>Top Up Saldo Akun</h2>
      <a href="dashboard.html" class="back-link">&larr; Beranda</a>
    </div>

    <!-- Informasi Saldo User Aktif -->
    <div class="balance-card">
      <span>SALDO AKUN SAAT INI</span>
      <h3 id="userCurrentBalance">Rp 0</h3>
    </div>

    <!-- LANGKAH 1: Input Nominal -->
    <div id="step-input">
      <div class="form-group">
        <label>Nominal Top Up (Minimum Rp 10.000)</label>
        <input type="number" id="topup-amount" placeholder="Cth: 50000" min="10000">
      </div>
      <button type="button" class="btn-action" onclick="proceedToPayment()">Lanjut ke Pembayaran</button>
    </div>

    <!-- LANGKAH 2: Informasi Transfer Rekening -->
    <div id="step-payment" class="hidden">
      <div class="payment-box">
        <p>Silakan transfer tepat sejumlah:</p>
        <strong id="display-nominal" style="color: var(--success); font-size: 18px;">Rp 0</strong>
        <p style="margin-top: 12px;">Ke Rekening Bank BCA:</p>
        <strong>1234567890</strong>
        <p>a.n. Partnership Global Media</p>
      </div>
      <button type="button" class="btn-action" onclick="submitFirebaseTopup()">Saya Sudah Transfer</button>
      <button type="button" onclick="backToInput()" style="width:100%; margin-top:8px; background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:12px;">&larr; Ubah Nominal</button>
    </div>

    <!-- LANGKAH 3: Berhasil Terkirim -->
    <div id="step-success" class="hidden">
      <div class="success-container">
        <div class="success-checkmark">
          <div class="check-icon">
            <span class="icon-line line-tip"></span>
            <span class="icon-line line-long"></span>
          </div>
        </div>
        <h3 style="color: #fff; margin-bottom: 6px;">Permintaan Terkirim!</h3>
        <p style="font-size: 12px; color: var(--text-muted); line-height: 1.4;">Permintaan top-up Anda berhasil dibuat dan sedang menunggu verifikasi oleh admin.</p>
        <a href="dashboard.html" class="btn-action" style="display: block; margin-top: 20px; text-decoration: none; line-height: 42px;">Kembali</a>
      </div>
    </div>
  </div>

  <!-- SCRIPT FIREBASE & LOGIKA TOPUP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Firebase Anda (Sesuaikan dengan file lainnya)
    const firebaseConfig = {
  apiKey: "AIzaSyAkt9-rMF_yiXC6M_K2wuExsIhDFFGcKQ8",
  authDomain: "website-smm-6b9be.firebaseapp.com",
  projectId: "website-smm-6b9be",
  storageBucket: "website-smm-6b9be.firebasestorage.app",
  messagingSenderId: "739072727667",
  appId: "1:739072727667:web:c860fc79ddc338b8fd6806",
  measurementId: "G-MB6NT6HQ6J"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.addEventListener("DOMContentLoaded", async function() {
      await loadUserBalance();
    });

    // Memuat saldo user terbaru dari sesi/database
    async function loadUserBalance() {
      const activeUserStr = sessionStorage.getItem('activeUserSession') || localStorage.getItem('activeUserSession');
      if (!activeUserStr) {
        alert("Silakan login terlebih dahulu untuk melakukan top up!");
        window.location.href = 'auth.html';
        return;
      }

      const activeUser = JSON.parse(activeUserStr);
      let balance = activeUser.balance || 0;

      try {
        if (activeUser.email) {
          const querySnapshot = await getDocs(collection(db, "users"));
          querySnapshot.forEach((docSnap) => {
            const uData = docSnap.data();
            if (uData.email === activeUser.email) {
              balance = uData.balance || 0;
            }
          });
        }
      } catch (e) {
        console.error("Gagal mengambil saldo database:", e);
      }

      document.getElementById('userCurrentBalance').innerText = 'Rp ' + Number(balance).toLocaleString('id-ID');
    }

    // Navigasi Langkah Pembayaran
    window.proceedToPayment = function() {
      const amountInput = document.getElementById('topup-amount').value;
      const amount = parseInt(amountInput);

      if (!amount || amount < 10000) {
        alert('Minimal nominal top-up adalah Rp 10.000!');
        return;
      }

      document.getElementById('display-nominal').innerText = 'Rp ' + amount.toLocaleString('id-ID');
      document.getElementById('step-input').classList.add('hidden');
      document.getElementById('step-payment').classList.remove('hidden');
    }

    window.backToInput = function() {
      document.getElementById('step-payment').classList.add('hidden');
      document.getElementById('step-input').classList.remove('hidden');
    }

    // Mengirim Permintaan Top-Up ke Firebase Firestore (Masuk ke admin.html)
    window.submitFirebaseTopup = async function() {
      const amount = parseInt(document.getElementById('topup-amount').value);
      const activeUserStr = sessionStorage.getItem('activeUserSession') || localStorage.getItem('activeUserSession');
      
      if (!activeUserStr) {
        alert("Sesi kedaluwarsa. Silakan login ulang.");
        window.location.href = 'auth.html';
        return;
      }

      const activeUser = JSON.parse(activeUserStr);

      try {
        await addDoc(collection(db, "topupRequests"), {
          userEmail: activeUser.email,
          userName: activeUser.name,
          amount: amount,
          status: "Pending",
          createdAt: new Date()
        });

        document.getElementById('step-payment').classList.add('hidden');
        document.getElementById('step-success').classList.remove('hidden');

      } catch (error) {
        console.error("Gagal mengirim permintaan top-up:", error);
        alert("Terjadi kesalahan saat memproses top-up ke server.");
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#6855ff">

<meta name="description"
      content="Login dan pendaftaran akun MultiBooster Media">

<title>Login - MultiBooster Media</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:14px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(74,72,190,.45),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(190,55,190,.30),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #050816,
            #0d1428,
            #050816
        );
}


/* ================================
   LOGIN BOX
================================ */

.login-box{

    width:100%;
    max-width:430px;

    padding:28px;

    border-radius:26px;

    background:
        rgba(18,25,47,.96);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.60);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}


/* ================================
   LOGO
================================ */

.logo{

    width:76px;
    height:76px;

    margin:
        0 auto 16px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:25px;

    font-weight:900;

    background:

        linear-gradient(
            135deg,
            #6555ff,
            #bd45ff
        );

    box-shadow:

        0 15px 40px
        rgba(110,80,255,.45);
}


/* ================================
   TITLE
================================ */

h1{

    text-align:center;

    font-size:25px;

    margin-bottom:7px;
}


.subtitle{

    text-align:center;

    color:#9da8c2;

    font-size:14px;

    margin-bottom:25px;
}


/* ================================
   FORM
================================ */

.form-group{

    margin-bottom:16px;
}

label{

    display:block;

    margin-bottom:7px;

    color:#cbd2e5;

    font-size:13px;
}

input{

    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid
        #303b59;

    outline:none;

    background:#0b1121;

    color:#fff;

    font-size:15px;
}

input:focus{

    border-color:#805cff;

    box-shadow:
        0 0 0 3px
        rgba(128,92,255,.13);
}


/* ================================
   BUTTON
================================ */

button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:

        0 12px 35px
        rgba(108,80,255,.30);
}

button:disabled{

    opacity:.55;

    cursor:not-allowed;
}


/* ================================
   MESSAGE
================================ */

.message{

    display:none;

    margin-bottom:15px;

    padding:13px;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    line-height:1.5;
}

.message.show{

    display:block;
}

.message.error{

    background:
        rgba(255,60,80,.12);

    border:
        1px solid
        rgba(255,60,80,.25);

    color:#ff9ba6;
}

.message.success{

    background:
        rgba(50,220,130,.12);

    border:
        1px solid
        rgba(50,220,130,.25);

    color:#79efad;
}

.message.info{

    background:
        rgba(80,140,255,.12);

    border:
        1px solid
        rgba(80,140,255,.25);

    color:#9ec4ff;
}


/* ================================
   LOADING
================================ */

.loading{

    display:none;

    text-align:center;

    margin-top:15px;

    color:#aeb9d0;

    font-size:13px;
}

.loading.show{

    display:block;
}


/* ================================
   SWITCH
================================ */

.switch{

    text-align:center;

    margin-top:20px;

    color:#9da8c2;

    font-size:13px;
}

.switch span{

    color:#a88cff;

    font-weight:bold;

    cursor:pointer;
}


/* ================================
   REGISTER
================================ */

.register-fields{

    display:none;
}

.register-fields.show{

    display:block;
}


/* ================================
   MOBILE
================================ */

@media(max-width:480px){

    body{

        padding:10px;
    }

    .login-box{

        padding:
            24px 18px;

        border-radius:22px;
    }

    .logo{

        width:68px;
        height:68px;

        font-size:22px;
    }

    h1{

        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        MB
    </div>

    <h1 id="title">
        Login
    </h1>

    <div class="subtitle">
        MultiBooster Media
    </div>

    <div
        id="message"
        class="message">
    </div>

    <form id="authForm">

        <!-- REGISTER -->

        <div
            id="registerFields"
            class="register-fields">

            <div class="form-group">

                <label>
                    Nama
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Nama lengkap"
                    autocomplete="name">

            </div>

            <div class="form-group">

                <label>
                    Nomor WhatsApp
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="08xxxxxxxxxx"
                    autocomplete="tel">

            </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

        </div>


        <button
            id="submitBtn"
            type="submit">

            Login

        </button>

    </form>


    <div
        id="loading"
        class="loading">

        Memproses...

    </div>


    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById(
        "authForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const nameInput =
    document.getElementById(
        "name"
    );

const phoneInput =
    document.getElementById(
        "phone"
    );

const registerFields =
    document.getElementById(
        "registerFields"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const switchText =
    document.getElementById(
        "switchText"
    );

const title =
    document.getElementById(
        "title"
    );

const message =
    document.getElementById(
        "message"
    );

const loading =
    document.getElementById(
        "loading"
    );


/* =====================================================
   ADMIN
===================================================== */

const ADMIN_UID =
    "WwWSSJ0oGlaEh0ylexszH2Z5lZN2";


/* =====================================================
   STATE
===================================================== */

let registerMode = false;

let redirectStarted = false;

let authStateHandled = false;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "info"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;
}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
    active,
    text = "Memproses..."
){

    submitBtn.disabled =
        active;

    loading.textContent =
        text;

    loading.classList.toggle(
        "show",
        active
    );
}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function isAdmin(user){

    if(
        !user ||
        !user.uid
    ){

        return false;
    }


    if(
        user.uid !== ADMIN_UID
    ){

        return false;
    }


    const adminRef =
        doc(
            db,
            "admins",
            ADMIN_UID
        );


    const adminSnap =
        await getDoc(
            adminRef
        );


    if(
        !adminSnap.exists()
    ){

        return false;
    }


    const data =
        adminSnap.data();


    const role =
        String(
            data.Role ?? ""
        )
        .trim()
        .toLowerCase();


    const active =
        data.Active === true;


    return (
        role === "admin" &&
        active === true
    );
}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(user){

    if(
        !user ||
        !user.uid
    ){

        return {
            exists:false,
            blocked:false
        };
    }


    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snap =
        await getDoc(
            userRef
        );


    if(
        !snap.exists()
    ){

        return {
            exists:false,
            blocked:false
        };
    }


    const data =
        snap.data();


    return {

        exists:true,

        blocked:
            data.isBlocked === true
    };
}


/* =====================================================
   REDIRECT
===================================================== */

function goTo(page){

    if(
        redirectStarted
    ){

        return;
    }


    redirectStarted =
        true;


    setLoading(
        true,
        "Membuka halaman..."
    );


    window.location.replace(
        page
    );
}


/* =====================================================
   PROCESS AUTH USER
===================================================== */

async function processAuthUser(user){

    if(
        !user ||
        redirectStarted
    ){

        return;
    }


    try{

        setLoading(
            true,
            "Memeriksa akun..."
        );


        /* =============================================
           ADMIN
        ============================================= */

        const admin =
            await isAdmin(
                user
            );


        if(admin){

            showMessage(
                "Login berhasil. Membuka panel admin...",
                "success"
            );


            setTimeout(
                ()=>{

                    goTo(
                        "admin.html"
                    );

                },
                400
            );


            return;
        }


        /* =============================================
           USER
        ============================================= */

        const userData =
            await checkUser(
                user
            );


        /* =============================================
           USER TIDAK MEMILIKI PROFIL
        ============================================= */

        if(
            !userData.exists
        ){

            /*
             * Untuk akun lama yang sudah ada
             * di Authentication tetapi belum memiliki
             * dokumen users, buat profil otomatis.
             *
             * Data nama dan nomor tidak diketahui
             * sehingga menggunakan nilai default.
             */

            await setDoc(

                doc(
                    db,
                    "users",
                    user.uid
                ),

                {

                    uid:
                        user.uid,

                    name:
                        user.displayName ||
                        "User",

                    phone:
                        "",

                    email:
                        user.email || "",

                    balance:
                        0,

                    isBlocked:
                        false,

                    photoURL:
                        user.photoURL || "",

                    createdAt:
                        serverTimestamp()

                },

                {
                    merge:true
                }

            );


            /*
             * Cek kembali profil setelah dibuat.
             */

            const newUserData =
                await checkUser(
                    user
                );


            if(
                newUserData.blocked
            ){

                await signOut(
                    auth
                );


                setLoading(
                    false
                );


                showMessage(
                    "Akun Anda telah diblokir oleh admin.",
                    "error"
                );


                return;
            }
        }


        /* =============================================
           BLOKIR USER
        ============================================= */

        const finalUserData =
            await checkUser(
                user
            );


        if(
            finalUserData.blocked
        ){

            await signOut(
                auth
            );


            setLoading(
                false
            );


            showMessage(
                "Akun Anda telah diblokir oleh admin.",
                "error"
            );


            return;
        }


        /* =============================================
           USER NORMAL
        ============================================= */

        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        setTimeout(
            ()=>{

                goTo(
                    "dashboard.html"
                );

            },
            400
        );


    }catch(error){

        console.error(
            "Auth processing error:",
            error
        );


        redirectStarted =
            false;


        setLoading(
            false
        );


        showMessage(
            "Tidak dapat memeriksa akun. Silakan coba lagi.",
            "error"
        );
    }
}


/* =====================================================
   PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

}catch(error){

    console.error(
        "Firebase persistence error:",
        error
    );
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(

    auth,

    async(user)=>{

        if(
            !user
        ){

            setLoading(
                false
            );

            return;
        }


        if(
            authStateHandled ||
            redirectStarted
        ){

            return;
        }


        authStateHandled =
            true;


        await processAuthUser(
            user
        );

    }

);


/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(

    "submit",

    async(event)=>{

        event.preventDefault();


        if(
            redirectStarted
        ){

            return;
        }


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email
        ){

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            return;
        }


        if(
            !password
        ){

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            return;
        }


        setLoading(

            true,

            registerMode
                ? "Membuat akun..."
                : "Login..."

        );


        try{

            /* =========================================
               REGISTER
            ========================================= */

            if(
                registerMode
            ){

                const name =
                    nameInput.value.trim();


                const phone =
                    phoneInput.value.trim();


                if(
                    !name
                ){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(
                    !phone
                ){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                /*
                 * Buat akun Firebase Authentication
                 */

                const credential =
                    await
                    createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                /*
                 * Buat dokumen users/{UID}
                 *
                 * Struktur dibuat sama dengan
                 * dokumen users yang sekarang.
                 */

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email || email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        photoURL:
                            user.photoURL || "",

                        createdAt:
                            serverTimestamp()

                    }

                );


                /*
                 * Berhasil.
                 */

                redirectStarted =
                    true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setTimeout(
                    ()=>{

                        window.location.replace(
                            "dashboard.html"
                        );

                    },
                    400
                );


                return;
            }


            /* =========================================
               LOGIN
            ========================================= */

            await
            signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        }catch(error){

            console.error(
                "Login/Register error:",
                error
            );


            redirectStarted =
                false;


            authStateHandled =
                false;


            setLoading(
                false
            );


            let text =
                "Login gagal.";


            switch(
                error.code
            ){

                case "auth/invalid-credential":

                    text =
                        "Email atau password salah.";

                    break;


                case "auth/user-not-found":

                    text =
                        "Akun tidak ditemukan.";

                    break;


                case "auth/wrong-password":

                    text =
                        "Password salah.";

                    break;


                case "auth/invalid-email":

                    text =
                        "Format email tidak valid.";

                    break;


                case "auth/email-already-in-use":

                    text =
                        "Email sudah terdaftar.";

                    break;


                case "auth/weak-password":

                    text =
                        "Password minimal 6 karakter.";

                    break;


                case "auth/too-many-requests":

                    text =
                        "Terlalu banyak percobaan. Coba lagi nanti.";

                    break;


                case "permission-denied":

                    text =
                        "Akses database ditolak oleh Firebase Rules.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        text =
                            error.message;
                    }

            }


            showMessage(
                text,
                "error"
            );
        }

    }

);


/* =====================================================
   SWITCH LOGIN / REGISTER
===================================================== */

switchText.addEventListener(

    "click",

    ()=>{

        registerMode =
            !registerMode;


        if(
            registerMode
        ){

            title.textContent =
                "Daftar Akun";


            registerFields.classList.add(
                "show"
            );


            submitBtn.textContent =
                "Daftar";


            switchText.textContent =
                "Sudah punya akun? Login";


            passwordInput.autocomplete =
                "new-password";


            nameInput.focus();


            return;
        }


        title.textContent =
            "Login";


        registerFields.classList.remove(
            "show"
        );


        submitBtn.textContent =
            "Login";


        switchText.textContent =
            "Belum punya akun? Daftar";


        passwordInput.autocomplete =
            "current-password";


        emailInput.focus();

    }

);

</script>

</body>
</html>

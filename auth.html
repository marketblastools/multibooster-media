<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultiBooster Media</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:16px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(74,72,190,.45),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(190,55,190,.30),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050816,
            #0d1428,
            #050816
        );
}

.login-box{
    width:100%;
    max-width:420px;

    padding:30px;

    border-radius:26px;

    background:
        rgba(18,25,47,.95);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.60);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);
}

.logo{
    width:76px;
    height:76px;

    margin:
        0 auto 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:25px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #6555ff,
            #bd45ff
        );

    box-shadow:
        0 15px 40px
        rgba(110,80,255,.45);
}

h1{
    text-align:center;

    font-size:25px;

    margin-bottom:7px;
}

.subtitle{
    text-align:center;

    color:#9da8c2;

    font-size:14px;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;

    margin-bottom:7px;

    color:#cbd2e5;

    font-size:13px;
}

input{
    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid
        #303b59;

    outline:none;

    background:#0b1121;

    color:#fff;

    font-size:15px;
}

input:focus{
    border-color:#805cff;

    box-shadow:
        0 0 0 3px
        rgba(128,92,255,.13);
}

button{
    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 35px
        rgba(108,80,255,.30);

    transition:
        .2s ease;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.55;

    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:13px;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    line-height:1.5;
}

.message.show{
    display:block;
}

.message.error{
    background:
        rgba(255,60,80,.12);

    border:
        1px solid
        rgba(255,60,80,.25);

    color:#ff9ba6;
}

.message.success{
    background:
        rgba(50,220,130,.12);

    border:
        1px solid
        rgba(50,220,130,.25);

    color:#79efad;
}

.message.info{
    background:
        rgba(80,140,255,.12);

    border:
        1px solid
        rgba(80,140,255,.25);

    color:#9ec4ff;
}

.loading{
    display:none;

    text-align:center;

    margin-top:15px;

    color:#aeb9d0;

    font-size:13px;
}

.loading.show{
    display:block;
}

.switch{
    text-align:center;

    margin-top:20px;

    color:#9da8c2;

    font-size:13px;
}

.switch span{
    color:#a88cff;

    font-weight:bold;

    cursor:pointer;
}

.register-fields{
    display:none;
}

.register-fields.show{
    display:block;
}

/* =========================================
   DEBUG
========================================= */

.debug-box{
    display:none;

    margin-top:15px;

    padding:14px;

    border-radius:13px;

    background:
        rgba(0,0,0,.30);

    border:
        1px solid
        rgba(255,255,255,.10);

    color:#b8c3da;

    font-size:11px;

    line-height:1.7;

    word-break:break-word;
}

.debug-box.show{
    display:block;
}

.debug-title{
    color:#fff;

    font-weight:bold;

    margin-bottom:7px;
}

.debug-row{
    display:flex;

    gap:6px;

    margin:2px 0;
}

.debug-label{
    color:#7f8ba5;
}

.debug-value{
    color:#dbe3f5;
}

.status-ok{
    color:#55e39b !important;

    font-weight:bold;
}

.status-no{
    color:#ff7885 !important;

    font-weight:bold;
}

.status-info{
    color:#9ec4ff !important;

    font-weight:bold;
}

.uid-match{
    margin-top:8px;

    padding:8px;

    border-radius:8px;

    background:
        rgba(50,220,130,.08);

    color:#79efad;

    font-size:10px;

    word-break:break-all;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .login-box{
        padding:
            25px 20px;

        border-radius:22px;
    }

    .logo{
        width:68px;
        height:68px;

        font-size:22px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

    </div>

    <form id="authForm">

    <div
        id="debugBox"

        <div class="debug-title">

        </div>

        <div class="debug-row">

            <span class="debug-label">
                UID:
            </span>

            <span
                id="debugUID"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                Email:
            </span>

            <span
                id="debugEmail"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                UID cocok:
            </span>

            <span
                id="debugUIDMatch"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                Admin:
            </span>

            <span
                id="debugAdmin"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                Role:
            </span>

            <span
                id="debugRole"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                Active:
            </span>

            <span
                id="debugActive"
                class="debug-value">

                -

            </span>

        </div>

        <div class="debug-row">

            <span class="debug-label">
                Tujuan:
            </span>

            <span
                id="debugTarget"

        </div>

    </div>

    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"
};


/* =====================================================
   FIREBASE INIT
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById(
        "authForm"
    );

const emailInput =
    document.getElementById(
        "email"
    );

const passwordInput =
    document.getElementById(
        "password"
    );

const nameInput =
    document.getElementById(
        "name"
    );

const phoneInput =
    document.getElementById(
        "phone"
    );

const registerFields =
    document.getElementById(
        "registerFields"
    );

const submitBtn =
    document.getElementById(
        "submitBtn"
    );

const switchText =
    document.getElementById(
        "switchText"
    );

const title =
    document.getElementById(
        "title"
    );

const message =
    document.getElementById(
        "message"
    );

const loading =
    document.getElementById(
        "loading"
    );

const debugBox =
    document.getElementById(
        "debugBox"
    );

const debugUID =
    document.getElementById(
        "debugUID"
    );

const debugEmail =
    document.getElementById(
        "debugEmail"
    );

const debugUIDMatch =
    document.getElementById(
        "debugUIDMatch"
    );

const debugAdmin =
    document.getElementById(
        "debugAdmin"
    );

const debugRole =
    document.getElementById(
        "debugRole"
    );

const debugActive =
    document.getElementById(
        "debugActive"
    );

const debugTarget =
    document.getElementById(
        "debugTarget"
    );

const debugPath =
    document.getElementById(
        "debugPath"
    );


/* =====================================================
   SETTINGS
===================================================== */

let registerMode =
    false;

let redirectStarted =
    false;


/*
   UID ADMIN ANDA

   HARUS SAMA DENGAN:

   Authentication > Users > User UID

   DAN:

   Firestore > admins > Document ID
*/

const ADMIN_UID =
    "WwWSSJ0oGlaEh0ylexszH2Z5lZN2";


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "info"
){

    message.textContent =
        text;

    message.className =
        "message show " +
        type;
}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
    active,
    text = "Memproses..."
){

    submitBtn.disabled =
        active;

    loading.textContent =
        text;

    loading.classList.toggle(
        "show",
        active
    );
}


/* =====================================================
   DEBUG
===================================================== */

function showDebug(
    user,
    adminFound,
    role,
    active,
    target
){

    debugBox.classList.add(
        "show"
    );


    const uid =
        user?.uid || "";


    debugUID.textContent =
        uid || "-";


    debugEmail.textContent =
        user?.email || "-";


    const uidMatch =
        uid === ADMIN_UID;


    debugUIDMatch.textContent =
        uidMatch
        ? "YA"
        : "TIDAK";


    debugUIDMatch.className =
        "debug-value " +
        (
            uidMatch
            ? "status-ok"
            : "status-no"
        );


    debugAdmin.textContent =
        adminFound
        ? "YA"
        : "TIDAK";


    debugAdmin.className =
        "debug-value " +
        (
            adminFound
            ? "status-ok"
            : "status-no"
        );


    debugRole.textContent =
        role || "-";


    debugActive.textContent =
        active === true
        ? "true"
        : active === false
        ? "false"
        : "-";


    debugActive.className =
        "debug-value " +
        (
            active === true
            ? "status-ok"
            : "status-no"
        );


    debugTarget.textContent =
        target || "-";


    debugPath.style.display =
        "block";


    debugPath.textContent =
        "Firestore path: admins/" +
        uid;
}


/* =====================================================
   REDIRECT
===================================================== */

function goTo(
    page
){

    if(
        redirectStarted
    ){
        return;
    }


    redirectStarted =
        true;


    console.log(
        "REDIRECT →",
        page
    );


    setLoading(
        true,
        "Membuka " +
        page +
        "..."
    );


    window.location.replace(
        page
    );
}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(
    user
){

    if(
        !user ||
        !user.uid
    ){

        throw new Error(
            "Akun Firebase tidak tersedia."
        );
    }


    console.log(
        "================================"
    );

    console.log(
        "ADMIN CHECK"
    );

    console.log(
        "LOGIN UID:",
        user.uid
    );

    console.log(
        "ADMIN UID:",
        ADMIN_UID
    );


    /*
       CEK UID ADMIN

       Ini hanya sebagai pemeriksaan
       tambahan.

       Data role tetap dibaca
       dari Firestore.
    */

    const uidMatch =
        user.uid === ADMIN_UID;


    console.log(
        "UID COCOK:",
        uidMatch
    );


    /*
       BACA:

       admins/{UID LOGIN}
    */

    const adminRef =
        doc(
            db,
            "admins",
            user.uid
        );


    let adminSnap;


    try{

        adminSnap =
            await getDoc(
                adminRef
            );

    }catch(error){

        console.error(
            "ADMIN READ ERROR:",
            error
        );


        showDebug(
            user,
            false,
            "READ ERROR",
            false,
            "PEMERIKSAAN GAGAL"
        );


        throw new Error(
            "Firestore menolak pembacaan data admin. Pastikan Firestore Rules sudah di-Publish."
        );
    }


    /*
       DOKUMEN TIDAK ADA
    */

    if(
        !adminSnap.exists()
    ){

        console.error(
            "ADMIN DOCUMENT TIDAK ADA:"
        );

        console.error(
            "admins/" +
            user.uid
        );


        showDebug(
            user,
            false,
            "",
            false,
            "DOKUMEN ADMIN TIDAK ADA"
        );


        return {

            isAdmin:
                false,

            role:
                "",

            active:
                false,

            uidMatch:
                uidMatch
        };
    }


    /*
       DATA ADMIN
    */

    const data =
        adminSnap.data();


    console.log(
        "DATA ADMIN:",
        data
    );


    const role =
        String(
            data.role ?? ""
        )
        .trim()
        .toLowerCase();


    const active =
        data.active === true;


    const isAdmin =
        role === "admin" &&
        active === true;


    console.log(
        "ROLE:",
        role
    );


    console.log(
        "ACTIVE:",
        active
    );


    console.log(
        "IS ADMIN:",
        isAdmin
    );


    showDebug(
        user,
        true,
        role,
        active,
        isAdmin
        ? "admin.html"
        : "dashboard.html"
    );


    return {

        isAdmin:
            isAdmin,

        role:
            role,

        active:
            active,

        uidMatch:
            uidMatch
    };
}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(
    user
){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    try{

        const snap =
            await getDoc(
                userRef
            );


        if(
            !snap.exists()
        ){

            return {

                exists:
                    false,

                blocked:
                    false
            };
        }


        const data =
            snap.data();


        return {

            exists:
                true,

            blocked:
                data.isBlocked === true
        };

    }catch(error){

        console.error(
            "USER READ ERROR:",
            error
        );


        throw new Error(
            "Gagal membaca data user. Periksa Firestore Rules."
        );
    }
}


/* =====================================================
   REDIRECT ROLE
===================================================== */

async function redirectByRole(
    user
){

    if(
        !user
    ){
        return;
    }


    if(
        redirectStarted
    ){
        return;
    }


    setLoading(
        true,
        "Memeriksa akun..."
    );


    showMessage(
        "Memeriksa hak akses akun...",
        "info"
    );


    try{

        /*
           ==========================================
           ADMIN CHECK
           ==========================================
        */

        const admin =
            await checkAdmin(
                user
            );


        /*
           ==========================================
           ADMIN
           ==========================================
        */

        if(
            admin.isAdmin
        ){

            console.log(
                "================================"
            );

            console.log(
                "ADMIN BERHASIL DIVERIFIKASI"
            );

            console.log(
                "UID:",
                user.uid
            );

            console.log(
                "ROLE:",
                admin.role
            );

            console.log(
                "ACTIVE:",
                admin.active
            );

            console.log(
                "REDIRECT → admin.html"
            );


            showMessage(
                "Admin terdeteksi. Membuka panel admin...",
                "success"
            );


            setTimeout(
                ()=>{
                    goTo(
                        "admin.html"
                    );
                },
                300
            );


            return;
        }


        /*
           ==========================================
           JIKA UID ADMIN COCOK TAPI DATA SALAH
           ==========================================
        */

        if(
            admin.uidMatch
        ){

            console.error(
                "UID ADMIN COCOK TETAPI DOKUMEN ADMIN TIDAK VALID."
            );


            setLoading(
                false
            );


            showMessage(
                "UID admin sudah benar, tetapi data admins belum valid. Pastikan role = admin dan active = true.",
                "error"
            );


            debugTarget.textContent =
                "ADMIN TERDETEKSI TAPI DATA TIDAK VALID";


            return;
        }


        /*
           ==========================================
           USER BIASA
           ==========================================
        */

        const userData =
            await checkUser(
                user
            );


        /*
           ==========================================
           BLOCKED
           ==========================================
        */

        if(
            userData.blocked
        ){

            await signOut(
                auth
            );


            redirectStarted =
                false;


            setLoading(
                false
            );


            showMessage(
                "Akun Anda telah diblokir oleh admin.",
                "error"
            );


            showDebug(
                user,
                false,
                "user",
                false,
                "AKUN DIBLOKIR"
            );


            return;
        }


        /*
           ==========================================
           NORMAL USER
           ==========================================
        */

        console.log(
            "USER BIASA"
        );


        console.log(
            "REDIRECT → dashboard.html"
        );


        showDebug(
            user,
            false,
            "user",
            true,
            "dashboard.html"
        );


        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        setTimeout(
            ()=>{
                goTo(
                    "dashboard.html"
                );
            },
            300
        );

    }catch(error){

        console.error(
            "ROLE CHECK ERROR:",
            error
        );


        redirectStarted =
            false;


        setLoading(
            false
        );


        showMessage(
            error.message ||
            "Gagal memeriksa hak akses akun.",
            "error"
        );


        debugBox.classList.add(
            "show"
        );


        debugTarget.textContent =
            "TIDAK ADA REDIRECT";
    }
}


/* =====================================================
   PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );


    console.log(
        "Firebase persistence aktif."
    );

}catch(error){

    console.error(
        "Persistence error:",
        error
    );
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
            ? user.uid
            : "BELUM LOGIN"
        );


        if(
            user &&
            !redirectStarted
        ){

            await redirectByRole(
                user
            );
        }

    }
);


/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();


        if(
            redirectStarted
        ){
            return;
        }


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email
        ){

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            return;
        }


        if(
            !password
        ){

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            return;
        }


        setLoading(
            true,
            registerMode
            ? "Membuat akun..."
            : "Login..."
        );


        showMessage(
            registerMode
            ? "Mendaftarkan akun..."
            : "Menghubungkan ke Firebase...",
            "info"
        );


        try{

            /* =========================================
               REGISTER
            ========================================= */

            if(
                registerMode
            ){

                const name =
                    nameInput.value.trim();


                const phone =
                    phoneInput.value.trim();


                if(
                    !name
                ){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(
                    !phone
                ){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                /*
                   USER PROFILE
                */

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        role:
                            "user",

                        createdAt:
                            serverTimestamp()
                    }
                );


                /*
                   REGISTER SELALU USER
                */

                redirectStarted =
                    true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setLoading(
                    true,
                    "Membuka dashboard..."
                );


                setTimeout(
                    ()=>{
                        window.location.replace(
                            "dashboard.html"
                        );
                    },
                    300
                );


                return;
            }


            /* =========================================
               LOGIN
            ========================================= */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "================================"
            );

            console.log(
                "LOGIN BERHASIL"
            );

            console.log(
                "EMAIL:",
                user.email
            );

            console.log(
                "UID:",
                user.uid
            );


            /*
               JANGAN LANGSUNG DASHBOARD.

               WAJIB CEK ADMIN.
            */

            await redirectByRole(
                user
            );

        }catch(error){

            console.error(
                "AUTH ERROR:",
                error
            );


            redirectStarted =
                false;


            setLoading(
                false
            );


            let text =
                "Login gagal.";


            switch(
                error.code
            ){

                case
                "auth/invalid-credential":

                    text =
                        "Email atau password salah.";

                    break;


                case
                "auth/user-not-found":

                    text =
                        "Akun tidak ditemukan.";

                    break;


                case
                "auth/wrong-password":

                    text =
                        "Password salah.";

                    break;


                case
                "auth/invalid-email":

                    text =
                        "Format email tidak valid.";

                    break;


                case
                "auth/email-already-in-use":

                    text =
                        "Email sudah terdaftar.";

                    break;


                case
                "auth/weak-password":

                    text =
                        "Password minimal 6 karakter.";

                    break;


                case
                "auth/too-many-requests":

                    text =
                        "Terlalu banyak percobaan. Coba lagi nanti.";

                    break;


                case
                "permission-denied":

                    text =
                        "Firestore Rules menolak akses.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        text =
                            error.message;
                    }

            }


            showMessage(
                text,
                "error"
            );


            debugBox.classList.add(
                "show"
            );


            debugTarget.textContent =
                "TIDAK ADA REDIRECT";
        }
    }
);


/* =====================================================
   LOGIN / REGISTER SWITCH
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
            !registerMode;


        if(
            registerMode
        ){

            title.textContent =
                "Daftar Akun";


            registerFields.classList.add(
                "show"
            );


            submitBtn.textContent =
                "Daftar";


            switchText.textContent =
                "Sudah punya akun? Login";


            passwordInput.autocomplete =
                "new-password";


            message.classList.remove(
                "show"
            );

        }else{

            title.textContent =
                "Login";


            registerFields.classList.remove(
                "show"
            );


            submitBtn.textContent =
                "Login";


            switchText.textContent =
                "Belum punya akun? Daftar";


            passwordInput.autocomplete =
                "current-password";


            message.classList.remove(
                "show"
            );
        }
    }
);


/* =====================================================
   GLOBAL ERROR
===================================================== */

window.addEventListener(
    "error",
    (event)=>{

        console.error(
            "GLOBAL ERROR:",
            event.error
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    (event)=>{

        console.error(
            "PROMISE ERROR:",
            event.reason
        );
    }
);

);

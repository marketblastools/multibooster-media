<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultiBooster Media</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;

    font-family:Arial,Helvetica,sans-serif;
    color:#fff;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(74,72,190,.45),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 90%,
            rgba(190,55,190,.30),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050816,
            #0d1428,
            #050816
        );
}

.login-box{
    width:100%;
    max-width:420px;
    padding:30px;

    border-radius:26px;

    background:rgba(18,25,47,.94);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px rgba(0,0,0,.60);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}

.logo{
    width:76px;
    height:76px;
    margin:0 auto 16px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:25px;
    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #6555ff,
            #bd45ff
        );

    box-shadow:
        0 15px 40px rgba(110,80,255,.45);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#9da8c2;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;

    color:#cbd2e5;
    font-size:13px;
}

input{
    width:100%;
    padding:14px 15px;

    border-radius:13px;
    border:1px solid #303b59;

    outline:none;

    background:#0b1121;
    color:#fff;

    font-size:15px;
}

input:focus{
    border-color:#805cff;

    box-shadow:
        0 0 0 3px rgba(128,92,255,.13);
}

button{
    width:100%;
    padding:15px;

    border:0;
    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 35px rgba(108,80,255,.30);
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:15px;
    padding:13px;

    border-radius:12px;

    text-align:center;

    font-size:13px;
    line-height:1.5;
}

.message.show{
    display:block;
}

.message.error{
    background:rgba(255,60,80,.12);
    border:1px solid rgba(255,60,80,.25);
    color:#ff9ba6;
}

.message.success{
    background:rgba(50,220,130,.12);
    border:1px solid rgba(50,220,130,.25);
    color:#79efad;
}

.message.info{
    background:rgba(80,140,255,.12);
    border:1px solid rgba(80,140,255,.25);
    color:#9ec4ff;
}

.loading{
    display:none;

    text-align:center;

    margin-top:15px;

    color:#aeb9d0;

    font-size:13px;
}

.loading.show{
    display:block;
}

.switch{
    text-align:center;

    margin-top:20px;

    color:#9da8c2;

    font-size:13px;
}

.switch span{
    color:#a88cff;
    font-weight:bold;
    cursor:pointer;
}

.register-fields{
    display:none;
}

.register-fields.show{
    display:block;
}

/* DEBUG ADMIN */

.debug-box{
    display:none;

    margin-top:15px;
    padding:14px;

    border-radius:13px;

    background:rgba(0,0,0,.30);

    border:1px solid rgba(255,255,255,.10);

    color:#b8c3da;

    font-size:11px;

    line-height:1.7;

    word-break:break-word;
}

.debug-box.show{
    display:block;
}

.debug-title{
    color:#fff;
    font-weight:bold;
    margin-bottom:7px;
}

.debug-row{
    display:flex;
    gap:6px;
    margin:2px 0;
}

.debug-label{
    color:#7f8ba5;
}

.debug-value{
    color:#dbe3f5;
}

.status-ok{
    color:#55e39b;
    font-weight:bold;
}

.status-no{
    color:#ff7885;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .login-box{
        padding:25px 20px;
        border-radius:22px;
    }

    .logo{
        width:68px;
        height:68px;
        font-size:22px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        MB
    </div>

    <h1 id="title">
        Login
    </h1>

    <div class="subtitle">
        MultiBooster Media
    </div>

    <div id="message" class="message"></div>

    <form id="authForm">

        <!-- REGISTER FIELDS -->

        <div id="registerFields" class="register-fields">

            <div class="form-group">

                <label>
                    Nama
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Nama lengkap"
                    autocomplete="name"
                >

            </div>

            <div class="form-group">

                <label>
                    Nomor WhatsApp
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="08xxxxxxxxxx"
                    autocomplete="tel"
                >

            </div>

        </div>

        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required
            >

        </div>

        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            id="submitBtn"
            type="submit">

            Login

        </button>

    </form>

    <div id="loading" class="loading">
        Memproses...
    </div>

    <!-- DEBUG INFO -->

    <div id="debugBox" class="debug-box">

        <div class="debug-title">
            Pemeriksaan Akun
        </div>

        <div class="debug-row">
            <span class="debug-label">UID:</span>
            <span id="debugUID" class="debug-value">-</span>
        </div>

        <div class="debug-row">
            <span class="debug-label">Email:</span>
            <span id="debugEmail" class="debug-value">-</span>
        </div>

        <div class="debug-row">
            <span class="debug-label">Admin:</span>
            <span id="debugAdmin" class="debug-value">-</span>
        </div>

        <div class="debug-row">
            <span class="debug-label">Role:</span>
            <span id="debugRole" class="debug-value">-</span>
        </div>

        <div class="debug-row">
            <span class="debug-label">Active:</span>
            <span id="debugActive" class="debug-value">-</span>
        </div>

        <div class="debug-row">
            <span class="debug-label">Tujuan:</span>
            <span id="debugTarget" class="debug-value">-</span>
        </div>

    </div>

    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const form =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const nameInput =
    document.getElementById("name");

const phoneInput =
    document.getElementById("phone");

const registerFields =
    document.getElementById("registerFields");

const submitBtn =
    document.getElementById("submitBtn");

const switchText =
    document.getElementById("switchText");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");

const debugBox =
    document.getElementById("debugBox");

const debugUID =
    document.getElementById("debugUID");

const debugEmail =
    document.getElementById("debugEmail");

const debugAdmin =
    document.getElementById("debugAdmin");

const debugRole =
    document.getElementById("debugRole");

const debugActive =
    document.getElementById("debugActive");

const debugTarget =
    document.getElementById("debugTarget");


/* =====================================================
   VARIABLES
===================================================== */

let registerMode = false;

let redirectStarted = false;

let initialAuthCheck = true;


/* =====================================================
   ADMIN UID REFERENSI
===================================================== */

const EXPECTED_ADMIN_UID =
    "WwWSSJ0oGlaEh0ylexszH2Z5lZN2";


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type = "info"
){

    message.textContent =
        text;

    message.className =
        "message show " + type;
}


/* =====================================================
   LOADING
===================================================== */

function setLoading(
    active,
    text = "Memproses..."
){

    submitBtn.disabled =
        active;

    loading.textContent =
        text;

    loading.classList.toggle(
        "show",
        active
    );
}


/* =====================================================
   DEBUG
===================================================== */

function showDebug(
    user,
    adminFound,
    role,
    active,
    target
){

    debugBox.classList.add(
        "show"
    );

    debugUID.textContent =
        user?.uid || "-";

    debugEmail.textContent =
        user?.email || "-";

    debugAdmin.textContent =
        adminFound
        ? "YA"
        : "TIDAK";

    debugAdmin.className =
        "debug-value " +
        (
            adminFound
            ? "status-ok"
            : "status-no"
        );

    debugRole.textContent =
        role || "-";

    debugActive.textContent =
        active === true
        ? "true"
        : active === false
        ? "false"
        : "-";

    debugActive.className =
        "debug-value " +
        (
            active === true
            ? "status-ok"
            : "status-no"
        );

    debugTarget.textContent =
        target || "-";
}


/* =====================================================
   REDIRECT
===================================================== */

function goTo(
    page
){

    if(
        redirectStarted
    ){
        return;
    }

    redirectStarted =
        true;

    console.log(
        "REDIRECT →",
        page
    );

    setLoading(
        true,
        "Membuka " + page + "..."
    );

    window.location.replace(
        page
    );
}


/* =====================================================
   CEK ADMIN
===================================================== */

async function checkAdmin(
    user
){

    if(
        !user ||
        !user.uid
    ){

        throw new Error(
            "Data akun Firebase tidak tersedia."
        );
    }


    console.log(
        "================================"
    );

    console.log(
        "PEMERIKSAAN ADMIN"
    );

    console.log(
        "UID LOGIN:",
        user.uid
    );

    console.log(
        "EMAIL:",
        user.email
    );

    console.log(
        "ADMIN UID TARGET:",
        EXPECTED_ADMIN_UID
    );


    /*
       ADMIN SELALU DICEK BERDASARKAN
       UID AKUN YANG BENAR-BENAR LOGIN.

       BUKAN berdasarkan email.
    */

    const adminRef =
        doc(
            db,
            "admins",
            user.uid
        );


    let adminSnap;

    try{

        adminSnap =
            await getDoc(
                adminRef
            );

    }catch(error){

        console.error(
            "GAGAL MEMBACA ADMIN:",
            error
        );

        showDebug(
            user,
            false,
            "READ ERROR",
            false,
            "PEMERIKSAAN GAGAL"
        );

        throw new Error(
            "Tidak dapat membaca data admin. Pastikan Firestore Rules sudah di-Publish."
        );
    }


    /*
       DOKUMEN TIDAK ADA
    */

    if(
        !adminSnap.exists()
    ){

        console.log(
            "DOKUMEN ADMIN TIDAK ADA"
        );

        showDebug(
            user,
            false,
            "",
            false,
            "dashboard.html"
        );

        return {
            isAdmin:false,
            role:"",
            active:false
        };
    }


    /*
       DOKUMEN ADA
    */

    const data =
        adminSnap.data();


    const role =
        String(
            data.role || ""
        )
        .trim()
        .toLowerCase();


    const active =
        data.active === true;


    const isAdmin =
        role === "admin" &&
        active === true;


    console.log(
        "DOKUMEN ADMIN ADA:",
        true
    );

    console.log(
        "ROLE:",
        role
    );

    console.log(
        "ACTIVE:",
        active
    );

    console.log(
        "IS ADMIN:",
        isAdmin
    );


    showDebug(
        user,
        true,
        role,
        active,
        isAdmin
        ? "admin.html"
        : "dashboard.html"
    );


    return {
        isAdmin,
        role,
        active
    };
}


/* =====================================================
   CEK USER
===================================================== */

async function checkUser(
    user
){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    try{

        const snap =
            await getDoc(
                userRef
            );


        if(
            !snap.exists()
        ){

            return {
                exists:false,
                blocked:false
            };
        }


        const data =
            snap.data();


        return {

            exists:true,

            blocked:
                data.isBlocked === true
        };

    }catch(error){

        console.error(
            "USER READ ERROR:",
            error
        );

        throw new Error(
            "Gagal membaca data user. Periksa Firestore Rules."
        );
    }
}


/* =====================================================
   REDIRECT BERDASARKAN ROLE
===================================================== */

async function redirectByRole(
    user
){

    if(
        !user
    ){
        return;
    }


    if(
        redirectStarted
    ){
        return;
    }


    console.log(
        "================================"
    );

    console.log(
        "MEMERIKSA AKUN LOGIN"
    );

    console.log(
        "EMAIL:",
        user.email
    );

    console.log(
        "UID:",
        user.uid
    );


    setLoading(
        true,
        "Memeriksa akun..."
    );

    showMessage(
        "Memeriksa hak akses akun...",
        "info"
    );


    try{

        /*
           ==========================================
           STEP 1
           CEK ADMIN
           ==========================================
        */

        const admin =
            await checkAdmin(
                user
            );


        /*
           ==========================================
           ADMIN
           ==========================================
        */

        if(
            admin.isAdmin
        ){

            showMessage(
                "Admin terdeteksi. Membuka panel admin...",
                "success"
            );

            console.log(
                "HASIL AKHIR: ADMIN"
            );

            console.log(
                "REDIRECT: admin.html"
            );


            setTimeout(
                ()=>{
                    goTo(
                        "admin.html"
                    );
                },
                300
            );

            return;
        }


        /*
           ==========================================
           STEP 2
           CEK USER BIASA
           ==========================================
        */

        const userData =
            await checkUser(
                user
            );


        /*
           ==========================================
           BLOCKED
           ==========================================
        */

        if(
            userData.blocked
        ){

            await signOut(
                auth
            );

            redirectStarted =
                false;

            setLoading(
                false
            );

            showMessage(
                "Akun Anda telah diblokir oleh admin.",
                "error"
            );

            showDebug(
                user,
                false,
                "user",
                false,
                "AKUN DIBLOKIR"
            );

            return;
        }


        /*
           ==========================================
           NORMAL USER
           ==========================================
        */

        console.log(
            "HASIL AKHIR: USER"
        );

        console.log(
            "REDIRECT: dashboard.html"
        );


        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        showDebug(
            user,
            false,
            "user",
            true,
            "dashboard.html"
        );


        setTimeout(
            ()=>{
                goTo(
                    "dashboard.html"
                );
            },
            300
        );

    }catch(error){

        console.error(
            "ROLE CHECK ERROR:",
            error
        );

        redirectStarted =
            false;

        setLoading(
            false
        );

        showMessage(
            error.message ||
            "Gagal memeriksa hak akses akun.",
            "error"
        );

        /*
           SENGAJA TIDAK REDIRECT
           KE DASHBOARD.

           Jika pemeriksaan admin gagal,
           halaman berhenti di sini.
        */

        debugBox.classList.add(
            "show"
        );

        debugTarget.textContent =
            "TIDAK ADA REDIRECT";
    }
}


/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "Firebase persistence aktif."
    );

}catch(error){

    console.error(
        "Persistence error:",
        error
    );
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
            ? user.uid
            : "BELUM LOGIN"
        );


        /*
           Saat halaman pertama kali dibuka
           dan Firebase masih memiliki session,
           kita tetap cek role.

           Tetapi jika user sedang login
           melalui form, redirectByRole()
           juga akan dijalankan.
        */

        if(
            user &&
            !redirectStarted
        ){

            await redirectByRole(
                user
            );
        }

        initialAuthCheck =
            false;
    }
);


/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();


        if(
            redirectStarted
        ){
            return;
        }


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email
        ){

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            return;
        }


        if(
            !password
        ){

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            return;
        }


        setLoading(
            true,
            registerMode
            ? "Membuat akun..."
            : "Login..."
        );


        showMessage(
            registerMode
            ? "Mendaftarkan akun..."
            : "Menghubungkan ke Firebase...",
            "info"
        );


        try{

            /* ==========================================
               REGISTER
            ========================================== */

            if(
                registerMode
            ){

                const name =
                    nameInput.value.trim();


                const phone =
                    phoneInput.value.trim();


                if(
                    !name
                ){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(
                    !phone
                ){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                console.log(
                    "USER BARU:",
                    user.uid
                );


                /*
                   Buat profile user.
                */

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        role:
                            "user",

                        createdAt:
                            serverTimestamp()
                    }
                );


                /*
                   Register SELALU menjadi user biasa.

                   Tidak boleh otomatis menjadi admin.
                */

                redirectStarted =
                    true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setLoading(
                    true,
                    "Membuka dashboard..."
                );


                setTimeout(
                    ()=>{
                        window.location.replace(
                            "dashboard.html"
                        );
                    },
                    300
                );


                return;
            }


            /* ==========================================
               LOGIN
            ========================================== */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "LOGIN BERHASIL"
            );

            console.log(
                "EMAIL LOGIN:",
                user.email
            );

            console.log(
                "UID LOGIN:",
                user.uid
            );


            /*
               PENTING:

               Jangan langsung dashboard.

               Periksa admin terlebih dahulu.
            */

            await redirectByRole(
                user
            );

        }catch(error){

            console.error(
                "AUTH ERROR:",
                error
            );


            redirectStarted =
                false;


            setLoading(
                false
            );


            let text =
                "Login gagal.";


            switch(
                error.code
            ){

                case
                "auth/invalid-credential":

                    text =
                        "Email atau password salah.";

                    break;


                case
                "auth/user-not-found":

                    text =
                        "Akun tidak ditemukan.";

                    break;


                case
                "auth/wrong-password":

                    text =
                        "Password salah.";

                    break;


                case
                "auth/invalid-email":

                    text =
                        "Format email tidak valid.";

                    break;


                case
                "auth/email-already-in-use":

                    text =
                        "Email sudah terdaftar.";

                    break;


                case
                "auth/weak-password":

                    text =
                        "Password minimal 6 karakter.";

                    break;


                case
                "auth/too-many-requests":

                    text =
                        "Terlalu banyak percobaan. Coba lagi nanti.";

                    break;


                case
                "permission-denied":

                    text =
                        "Firestore Rules menolak akses.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        text =
                            error.message;
                    }
            }


            showMessage(
                text,
                "error"
            );


            debugBox.classList.add(
                "show"
            );

            debugTarget.textContent =
                "TIDAK ADA REDIRECT";
        }
    }
);


/* =====================================================
   LOGIN / REGISTER SWITCH
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
            !registerMode;


        if(
            registerMode
        ){

            title.textContent =
                "Daftar Akun";


            registerFields.classList.add(
                "show"
            );


            submitBtn.textContent =
                "Daftar";


            switchText.textContent =
                "Sudah punya akun? Login";


            passwordInput.autocomplete =
                "new-password";


            showMessage(
                "",
                "info"
            );


            message.classList.remove(
                "show"
            );

        }else{

            title.textContent =
                "Login";


            registerFields.classList.remove(
                "show"
            );


            submitBtn.textContent =
                "Login";


            switchText.textContent =
                "Belum punya akun? Daftar";


            passwordInput.autocomplete =
                "current-password";


            message.classList.remove(
                "show"
            );
        }
    }
);


/* =====================================================
   GLOBAL ERROR
===================================================== */

window.addEventListener(
    "error",
    (event)=>{

        console.error(
            "GLOBAL ERROR:",
            event.error
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    (event)=>{

        console.error(
            "PROMISE ERROR:",
            event.reason
        );
    }
);

<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login - MultiBooster Media</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(74,72,190,.45),
            transparent 35%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(190,55,190,.30),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #050816,
            #0d1428,
            #050816
        );

}


/* =====================================================
   LOGIN BOX
===================================================== */

.login-box{

    width:100%;

    max-width:420px;

    padding:30px;

    border-radius:26px;

    background:
        rgba(18,25,47,.92);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.60);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:76px;

    height:76px;

    margin:
        0 auto 16px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:22px;

    font-size:25px;

    font-weight:900;

    background:
        linear-gradient(
            135deg,
            #6555ff,
            #bd45ff
        );

    box-shadow:
        0 15px 40px
        rgba(110,80,255,.45);

}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    font-size:25px;

    margin-bottom:7px;

}

.subtitle{

    text-align:center;

    color:#9da8c2;

    font-size:14px;

    margin-bottom:25px;

}


/* =====================================================
   FORM
===================================================== */

.form-group{

    margin-bottom:16px;

}

label{

    display:block;

    margin-bottom:7px;

    color:#cbd2e5;

    font-size:13px;

}

input{

    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid
        #303b59;

    outline:none;

    background:#0b1121;

    color:#fff;

    font-size:15px;

}

input:focus{

    border-color:#805cff;

    box-shadow:
        0 0 0 3px
        rgba(128,92,255,.13);

}


/* =====================================================
   BUTTON
===================================================== */

button{

    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 12px 35px
        rgba(108,80,255,.30);

}

button:disabled{

    opacity:.55;

    cursor:not-allowed;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    display:none;

    margin-bottom:15px;

    padding:13px;

    border-radius:12px;

    text-align:center;

    font-size:13px;

    line-height:1.5;

}

.message.show{

    display:block;

}

.message.error{

    background:
        rgba(255,60,80,.12);

    border:
        1px solid
        rgba(255,60,80,.25);

    color:#ff9ba6;

}

.message.success{

    background:
        rgba(50,220,130,.12);

    border:
        1px solid
        rgba(50,220,130,.25);

    color:#79efad;

}

.message.info{

    background:
        rgba(80,140,255,.12);

    border:
        1px solid
        rgba(80,140,255,.25);

    color:#9ec4ff;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    display:none;

    text-align:center;

    margin-top:15px;

    color:#aeb9d0;

    font-size:13px;

}

.loading.show{

    display:block;

}


/* =====================================================
   SWITCH
===================================================== */

.switch{

    text-align:center;

    margin-top:20px;

    color:#9da8c2;

    font-size:13px;

}

.switch span{

    color:#a88cff;

    font-weight:bold;

    cursor:pointer;

}


/* =====================================================
   REGISTER
===================================================== */

.register-fields{

    display:none;

}

.register-fields.show{

    display:block;

}


/* =====================================================
   SECURITY STATUS
===================================================== */

.debug-box{

    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(0,0,0,.25);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#9da8c2;

    font-size:11px;

    line-height:1.6;

    word-break:break-word;

}

.debug-box.show{

    display:block;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    body{

        padding:14px;

    }

    .login-box{

        padding:25px 20px;

        border-radius:22px;

    }

    .logo{

        width:68px;

        height:68px;

        font-size:22px;

    }

    h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo">
        MB
    </div>


    <!-- TITLE -->

    <h1 id="title">
        Login
    </h1>


    <div class="subtitle">
        MultiBooster Media
    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>


    <!-- FORM -->

    <form id="authForm">


        <!-- REGISTER -->

        <div
            id="registerFields"
            class="register-fields">


            <div class="form-group">

                <label>
                    Nama
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Nama lengkap"
                    autocomplete="name"
                >

            </div>


            <div class="form-group">

                <label>
                    Nomor WhatsApp
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="08xxxxxxxxxx"
                    autocomplete="tel"
                >

            </div>


        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

        </div>


        <!-- BUTTON -->

        <button
            id="submitBtn"
            type="submit">

            Login

        </button>


    </form>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading">

        Memproses...

    </div>


    <!-- DEBUG -->

    <div
        id="debugBox"
        class="debug-box">
    </div>


    <!-- SWITCH -->

    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>


</div>



<script type="module">


/* =====================================================
   FIREBASE SDK
===================================================== */

import {

    initializeApp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {

    getAuth,

    createUserWithEmailAndPassword,

    signInWithEmailAndPassword,

    onAuthStateChanged,

    setPersistence,

    browserLocalPersistence,

    signOut

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {

    getFirestore,

    doc,

    getDoc,

    setDoc,

    serverTimestamp

}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
   PROJECT: multibooster-media
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"

};



/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById(
        "authForm"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const nameInput =
    document.getElementById(
        "name"
    );


const phoneInput =
    document.getElementById(
        "phone"
    );


const registerFields =
    document.getElementById(
        "registerFields"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const switchText =
    document.getElementById(
        "switchText"
    );


const title =
    document.getElementById(
        "title"
    );


const message =
    document.getElementById(
        "message"
    );


const loading =
    document.getElementById(
        "loading"
    );


const debugBox =
    document.getElementById(
        "debugBox"
    );



/* =====================================================
   VARIABLES
===================================================== */

let registerMode =
    false;


let redirectStarted =
    false;



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="info"
){

    message.textContent =
        text;

    message.className =
        "message show " + type;

}



/* =====================================================
   LOADING
===================================================== */

function setLoading(
    value,
    text="Memproses..."
){

    submitBtn.disabled =
        value;

    loading.textContent =
        text;

    loading.classList.toggle(
        "show",
        value
    );

}



/* =====================================================
   DEBUG
===================================================== */

function debug(
    text
){

    console.log(
        "[MULTIBOOSTER]",
        text
    );

    debugBox.textContent =
        text;

}



/* =====================================================
   REDIRECT
===================================================== */

function goTo(
    page
){

    if(
        redirectStarted
    ){

        return;
    }


    redirectStarted =
        true;


    console.log(
        "REDIRECT:",
        page
    );


    setLoading(
        true,
        "Membuka " + page + "..."
    );


    /*
       replace digunakan supaya
       halaman login tidak muncul
       lagi ketika tombol Back ditekan.
    */

    window.location.replace(
        page
    );

}



/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(
    user
){

    console.log(
        "================================"
    );

    console.log(
        "CHECK ADMIN"
    );

    console.log(
        "UID:",
        user.uid
    );


    debug(
        "Memeriksa admin untuk UID: " +
        user.uid
    );


    /*
       PENTING:

       Firestore:

       admins
          |
          └── UID USER

       Contoh:

       admins/
       WwWSSJ0oGlaEh0ylexszH2Z5lZN2
    */

    const adminRef =
        doc(
            db,
            "admins",
            user.uid
        );


    let adminSnap;


    try{

        adminSnap =
            await getDoc(
                adminRef
            );

    }catch(error){

        console.error(
            "ADMIN READ ERROR:",
            error
        );


        debug(
            "ERROR membaca admins: " +
            error.code +
            " | " +
            error.message
        );


        /*
           JANGAN anggap sebagai user.

           Jika Rules bermasalah,
           hentikan proses supaya akun
           admin tidak salah diarahkan
           ke dashboard.
        */

        throw new Error(
            "Gagal membaca data admin. Periksa Firestore Rules."
        );

    }


    console.log(
        "ADMIN DOCUMENT EXISTS:",
        adminSnap.exists()
    );


    if(
        !adminSnap.exists()
    ){

        debug(
            "Dokumen admin tidak ditemukan untuk UID ini."
        );


        return false;
    }


    const data =
        adminSnap.data();


    console.log(
        "ADMIN DATA:",
        data
    );


    const role =
        String(
            data.role || ""
        ).trim().toLowerCase();


    const active =
        data.active === true;


    console.log(
        "ROLE:",
        role
    );


    console.log(
        "ACTIVE:",
        active
    );


    debug(
        "Admin ditemukan | " +
        "role=" +
        role +
        " | active=" +
        active
    );


    /*
       Harus memenuhi dua syarat:
       
       role = admin
       active = true
    */

    if(
        role === "admin" &&
        active === true
    ){

        return true;
    }


    return false;

}



/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(
    user
){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    try{

        const snap =
            await getDoc(
                userRef
            );


        if(
            !snap.exists()
        ){

            return {
                exists:false,
                blocked:false
            };

        }


        const data =
            snap.data();


        return {

            exists:true,

            blocked:
                data.isBlocked === true

        };

    }catch(error){

        console.error(
            "USER READ ERROR:",
            error
        );


        throw new Error(
            "Gagal membaca data user. Periksa Firestore Rules."
        );

    }

}



/* =====================================================
   REDIRECT BY ROLE
===================================================== */

async function redirectByRole(
    user
){

    if(
        !user
    ){

        return;
    }


    if(
        redirectStarted
    ){

        return;
    }


    console.log(
        "================================"
    );

    console.log(
        "MEMPROSES ROLE"
    );

    console.log(
        "EMAIL:",
        user.email
    );

    console.log(
        "UID:",
        user.uid
    );


    setLoading(
        true,
        "Memeriksa akun..."
    );


    showMessage(
        "Memeriksa hak akses akun...",
        "info"
    );


    try{

        /*
           ==========================================
           LANGKAH 1
           CEK ADMIN
           ==========================================
        */

        const isAdmin =
            await checkAdmin(
                user
            );


        if(
            isAdmin
        ){

            console.log(
                "================================"
            );

            console.log(
                "ADMIN VALID"
            );


            showMessage(
                "Login admin berhasil. Membuka panel admin...",
                "success"
            );


            debug(
                "ADMIN TERDETEKSI → admin.html"
            );


            /*
               LANGSUNG REDIRECT
            */

            setTimeout(
                ()=>{
                    goTo(
                        "admin.html"
                    );
                },
                250
            );


            return;
        }



        /*
           ==========================================
           LANGKAH 2
           CEK USER
           ==========================================
        */

        const userData =
            await checkUser(
                user
            );


        if(
            userData.blocked
        ){

            await signOut(
                auth
            );


            redirectStarted =
                false;


            setLoading(
                false
            );


            showMessage(
                "Akun Anda telah diblokir oleh admin.",
                "error"
            );


            debug(
                "AKUN DIBLOKIR"
            );


            return;
        }



        /*
           ==========================================
           NORMAL USER
           ==========================================
        */

        console.log(
            "ROLE: USER"
        );


        debug(
            "USER BIASA → dashboard.html"
        );


        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        setTimeout(
            ()=>{
                goTo(
                    "dashboard.html"
                );
            },
            250
        );


    }catch(error){

        console.error(
            "ROLE CHECK ERROR:",
            error
        );


        redirectStarted =
            false;


        setLoading(
            false
        );


        showMessage(
            error.message ||
            "Gagal memeriksa hak akses akun.",
            "error"
        );


        debug(
            "ERROR: " +
            (
                error.message ||
                "Unknown error"
            )
        );

    }

}



/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );


    console.log(
        "Firebase persistence aktif."
    );

}catch(error){

    console.error(
        "Persistence gagal:",
        error
    );

}



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
            ? user.uid
            : "BELUM LOGIN"
        );


        /*
           Jika sudah ada session Firebase,
           langsung periksa role.

           Tidak perlu klik.
        */

        if(
            user &&
            !redirectStarted
        ){

            await redirectByRole(
                user
            );

        }

    }
);



/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();


        if(
            redirectStarted
        ){

            return;
        }


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        if(
            !email
        ){

            showMessage(
                "Email wajib diisi.",
                "error"
            );

            return;
        }


        if(
            !password
        ){

            showMessage(
                "Password wajib diisi.",
                "error"
            );

            return;
        }


        setLoading(
            true,
            registerMode
            ? "Membuat akun..."
            : "Login..."
        );


        showMessage(
            registerMode
            ? "Mendaftarkan akun..."
            : "Menghubungkan ke Firebase...",
            "info"
        );


        try{


            /* ==========================================
               REGISTER
            ========================================== */

            if(
                registerMode
            ){

                const name =
                    nameInput.value.trim();


                const phone =
                    phoneInput.value.trim();


                if(
                    !name
                ){

                    throw new Error(
                        "Nama wajib diisi."
                    );

                }


                if(
                    !phone
                ){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );

                }


                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                console.log(
                    "USER CREATED:",
                    user.uid
                );


                /*
                   Simpan profile user
                */

                await setDoc(

                    doc(
                        db,
                        "users",
                        user.uid
                    ),

                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        role:
                            "user",

                        createdAt:
                            serverTimestamp()

                    }

                );


                redirectStarted =
                    true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setLoading(
                    true,
                    "Membuka dashboard..."
                );


                setTimeout(
                    ()=>{
                        window.location.replace(
                            "dashboard.html"
                        );
                    },
                    300
                );


                return;
            }



            /* ==========================================
               LOGIN
            ========================================== */

            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "LOGIN BERHASIL"
            );


            console.log(
                "EMAIL:",
                user.email
            );


            console.log(
                "UID:",
                user.uid
            );


            /*
               PENTING:

               Kita langsung memanggil
               redirectByRole.

               Tidak menunggu klik.
            */

            await redirectByRole(
                user
            );


        }catch(error){

            console.error(
                "AUTH ERROR:",
                error
            );


            redirectStarted =
                false;


            setLoading(
                false
            );


            let text =
                "Login gagal.";


            switch(
                error.code
            ){

                case
                "auth/invalid-credential":

                    text =
                        "Email atau password salah.";

                    break;


                case
                "auth/user-not-found":

                    text =
                        "Akun tidak ditemukan.";

                    break;


                case
                "auth/wrong-password":

                    text =
                        "Password salah.";

                    break;


                case
                "auth/invalid-email":

                    text =
                        "Format email tidak valid.";

                    break;


                case
                "auth/email-already-in-use":

                    text =
                        "Email sudah terdaftar.";

                    break;


                case
                "auth/weak-password":

                    text =
                        "Password minimal 6 karakter.";

                    break;


                case
                "auth/too-many-requests":

                    text =
                        "Terlalu banyak percobaan. Coba lagi nanti.";

                    break;


                case
                "permission-denied":

                    text =
                        "Firestore Rules menolak akses.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        text =
                            error.message;
                    }

            }


            showMessage(
                text,
                "error"
            );


            debug(
                "AUTH ERROR: " +
                text
            );

        }

    }
);



/* =====================================================
   SWITCH LOGIN / REGISTER
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
            !registerMode;


        if(
            registerMode
        ){

            title.textContent =
                "Daftar Akun";


            registerFields.classList.add(
                "show"
            );


            submitBtn.textContent =
                "Daftar";


            switchText.textContent =
                "Sudah punya akun? Login";


            passwordInput.autocomplete =
                "new-password";


        }else{

            title.textContent =
                "Login";


            registerFields.classList.remove(
                "show"
            );


            submitBtn.textContent =
                "Login";


            switchText.textContent =
                "Belum punya akun? Daftar";


            passwordInput.autocomplete =
                "current-password";

        }

    }
);



/* =====================================================
   GLOBAL ERROR HANDLER
===================================================== */

window.addEventListener(
    "error",
    (event)=>{

        console.error(
            "GLOBAL ERROR:",
            event.error
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    (event)=>{

        console.error(
            "PROMISE ERROR:",
            event.reason
        );

    }
);


console.log(
    "================================"
);

console.log(
    "MULTIBOOSTER AUTH AKTIF"
);

console.log(
    "PROJECT: multibooster-media"
);

console.log(

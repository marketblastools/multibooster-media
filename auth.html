<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultiBooster Media</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    font-family:Arial,sans-serif;
    color:#fff;

    background:
    radial-gradient(circle at top left,#293c78 0%,transparent 35%),
    radial-gradient(circle at bottom right,#641d70 0%,transparent 35%),
    linear-gradient(135deg,#070b18,#11182c,#080b16);
}

.login-box{
    width:100%;
    max-width:420px;
    padding:30px;

    border-radius:25px;

    background:rgba(20,27,48,.9);

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 25px 70px rgba(0,0,0,.55);

    backdrop-filter:blur(15px);
}

.logo{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:25px;
    font-weight:bold;

    background:
    linear-gradient(135deg,#6855ff,#b14cff);

    box-shadow:
    0 10px 35px rgba(120,70,255,.45);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#aab3c8;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    color:#cbd2e5;
    margin-bottom:7px;
}

input{
    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:1px solid #303b59;

    background:#0d1324;

    color:white;

    outline:none;

    font-size:15px;
}

input:focus{
    border-color:#805cff;

    box-shadow:
    0 0 0 3px rgba(128,92,255,.12);
}

button{
    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    color:white;

    font-size:15px;
    font-weight:bold;

    cursor:pointer;

    background:
    linear-gradient(135deg,#6855ff,#b14cff);

    box-shadow:
    0 10px 30px rgba(108,80,255,.3);
}

button:disabled{
    opacity:.6;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:12px;

    font-size:13px;

    text-align:center;
}

.error{
    display:block;

    background:rgba(255,60,80,.12);

    border:1px solid rgba(255,60,80,.25);

    color:#ff9ba6;
}

.success{
    display:block;

    background:rgba(50,220,130,.12);

    border:1px solid rgba(50,220,130,.25);

    color:#79efad;
}

.loading{
    display:none;

    margin-top:15px;

    text-align:center;

    color:#b9c2d8;

    font-size:13px;
}

.switch{
    text-align:center;

    margin-top:20px;

    font-size:13px;

    color:#aab3c8;
}

.switch span{
    color:#a88cff;

    cursor:pointer;

    font-weight:bold;
}

.register-fields{
    display:none;
}
</style>
</head>


<body>

<div class="login-box">

    <div class="logo">
        MB
    </div>

    <h1 id="title">
        Login
    </h1>

    <div class="subtitle">
        MultiBooster Media
    </div>

    <div
        id="message"
        class="message">
    </div>

    <form id="authForm">

        <div
            id="registerFields"
            class="register-fields">

            <div class="form-group">

                <label>
                    Nama
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Nama lengkap">

            </div>


            <div class="form-group">

                <label>
                    Nomor WhatsApp
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="08xxxxxxxxxx">

            </div>

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required>

        </div>


        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

        </div>


        <button
            id="submitBtn"
            type="submit">

            Login

        </button>

    </form>


    <div
        id="loading"
        class="loading">

        Memproses login...

    </div>


    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
    "multibooster-media.firebaseapp.com",

    projectId:
    "multibooster-media",

    storageBucket:
    "multibooster-media.firebasestorage.app",

    messagingSenderId:
    "455058483621",

    appId:
    "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
    "G-Z9S252K9C5"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);


/* =====================================================
   LOCAL PERSISTENCE
===================================================== */

await setPersistence(
    auth,
    browserLocalPersistence
);


/* =====================================================
   ELEMENT
===================================================== */

const form =
document.getElementById("authForm");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const nameInput =
document.getElementById("name");

const phoneInput =
document.getElementById("phone");

const registerFields =
document.getElementById("registerFields");

const submitBtn =
document.getElementById("submitBtn");

const switchText =
document.getElementById("switchText");

const title =
document.getElementById("title");

const message =
document.getElementById("message");

const loading =
document.getElementById("loading");


let registerMode = false;

let redirecting = false;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="error"
){

    message.textContent =
    text;

    message.className =
    "message " + type;

    message.style.display =
    "block";
}


/* =====================================================
   LOADING
===================================================== */

function loadingOn(){

    submitBtn.disabled =
    true;

    loading.style.display =
    "block";
}


function loadingOff(){

    submitBtn.disabled =
    false;

    loading.style.display =
    "none";
}


/* =====================================================
   REDIRECT
===================================================== */

function go(url){

    console.log(
        "REDIRECT:",
        url
    );

    /*
      location.href dipakai agar
      browser Android langsung
      berpindah halaman.
    */

    window.location.href =
    url;
}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function isAdmin(user){

    console.log(
        "================================"
    );

    console.log(
        "CHECK ADMIN"
    );

    console.log(
        "UID:",
        user.uid
    );


    const ref =
    doc(
        db,
        "admins",
        user.uid
    );


    const snap =
    await getDoc(ref);


    console.log(
        "ADMIN EXISTS:",
        snap.exists()
    );


    if(!snap.exists()){

        return false;
    }


    const data =
    snap.data();


    console.log(
        "ADMIN DATA:",
        data
    );


    console.log(
        "ROLE:",
        data.role
    );


    console.log(
        "ACTIVE:",
        data.active
    );


    return (
        data.role === "admin"
        &&
        data.active === true
    );
}


/* =====================================================
   CHECK USER
===================================================== */

async function getUserData(user){

    const ref =
    doc(
        db,
        "users",
        user.uid
    );


    const snap =
    await getDoc(ref);


    if(!snap.exists()){

        return null;
    }


    return snap.data();
}


/* =====================================================
   PROCESS LOGIN
===================================================== */

async function processLogin(user){

    if(
        !user ||
        redirecting
    ){

        return;
    }


    redirecting =
    true;


    loadingOn();


    try{

        console.log(
            "LOGIN BERHASIL"
        );

        console.log(
            "EMAIL:",
            user.email
        );

        console.log(
            "UID:",
            user.uid
        );


        /* =========================================
           CEK ADMIN
        ========================================= */

        const admin =
        await isAdmin(user);


        if(admin){

            console.log(
                "================================"
            );

            console.log(
                "ADMIN TERDETEKSI"
            );

            console.log(
                "MEMBUKA ADMIN.HTML"
            );


            showMessage(
                "Login admin berhasil. Membuka panel admin...",
                "success"
            );


            /*
              Beri sedikit waktu agar
              pesan sukses sempat diproses,
              lalu langsung pindah.
            */

            setTimeout(
                ()=>{
                    go("./admin.html");
                },
                100
            );


            return;
        }


        /* =========================================
           CEK USER
        ========================================= */

        const userData =
        await getUserData(user);


        if(
            userData &&
            userData.isBlocked === true
        ){

            await signOut(auth);


            redirecting =
            false;


            loadingOff();


            showMessage(
                "Akun Anda telah diblokir.",
                "error"
            );


            return;
        }


        console.log(
            "================================"
        );

        console.log(
            "USER TERDETEKSI"
        );

        console.log(
            "MEMBUKA DASHBOARD.HTML"
        );


        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        setTimeout(
            ()=>{
                go("./dashboard.html");
            },
            100
        );

    }catch(error){

        console.error(
            "PROCESS LOGIN ERROR:",
            error
        );


        redirecting =
        false;


        loadingOff();


        showMessage(
            error.message ||
            "Gagal memproses login.",
            "error"
        );
    }
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
            ? user.uid
            : "BELUM LOGIN"
        );


        /*
          Jika user sudah login dari session
          sebelumnya, langsung proses.

          Tetapi jika user baru saja login,
          processLogin() juga sudah dipanggil
          dari tombol login.
        */

        if(
            user &&
            !redirecting
        ){

            await processLogin(user);
        }

    }
);


/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();


        if(redirecting){

            return;
        }


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        loadingOn();


        message.style.display =
        "none";


        try{

            /* =====================================
               REGISTER
            ===================================== */

            if(registerMode){

                const name =
                nameInput.value.trim();


                const phone =
                phoneInput.value.trim();


                if(!name){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(!phone){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                const user =
                credential.user;


                console.log(
                    "REGISTER UID:",
                    user.uid
                );


                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        uid:
                        user.uid,

                        name:
                        name,

                        phone:
                        phone,

                        email:
                        user.email,

                        balance:
                        0,

                        isBlocked:
                        false,

                        role:
                        "user",

                        createdAt:
                        serverTimestamp()

                    }
                );


                /*
                  Setelah register langsung
                  ke dashboard.
                */

                redirecting =
                true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setTimeout(
                    ()=>{
                        go("./dashboard.html");
                    },
                    100
                );


                return;
            }


            /* =====================================
               LOGIN
            ===================================== */

            console.log(
                "MELAKUKAN LOGIN..."
            );


            const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            const user =
            credential.user;


            /*
              INI BAGIAN TERPENTING.

              Tidak menunggu klik.
              Tidak menunggu event lain.

              Begitu Firebase mengembalikan
              credential, langsung proses role.
            */

            await processLogin(user);

        }catch(error){

            console.error(
                "LOGIN ERROR:",
                error
            );


            redirecting =
            false;


            loadingOff();


            let text =
            "Login gagal.";


            switch(error.code){

                case "auth/invalid-credential":

                    text =
                    "Email atau password salah.";

                    break;


                case "auth/user-not-found":

                    text =
                    "Akun tidak ditemukan.";

                    break;


                case "auth/wrong-password":

                    text =
                    "Password salah.";

                    break;


                case "auth/invalid-email":

                    text =
                    "Format email tidak valid.";

                    break;


                case "auth/too-many-requests":

                    text =
                    "Terlalu banyak percobaan. Coba lagi nanti.";

                    break;


                case "permission-denied":

                    text =
                    "Firestore Rules menolak akses.";

                    break;


                default:

                    if(error.message){

                        text =
                        error.message;
                    }

            }


            showMessage(
                text,
                "error"
            );
        }

    }
);


/* =====================================================
   SWITCH LOGIN / REGISTER
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
        !registerMode;


        if(registerMode){

            title.textContent =
            "Daftar Akun";


            registerFields.style.display =
            "block";


            submitBtn.textContent =
            "Daftar";


            switchText.textContent =
            "Sudah punya akun? Login";


            passwordInput.autocomplete =
            "new-password";

        }else{

            title.textContent =
            "Login";


            registerFields.style.display =
            "none";


            submitBtn.textContent =
            "Login";


            switchText.textContent =
            "Belum punya akun? Daftar";


            passwordInput.autocomplete =
            "current-password";
        }

    }
);

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultiBooster Media</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at top left,
            #263b70 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at bottom right,
            #531b5d 0%,
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #070b18,
            #11182c,
            #080b16
        );
}

.login-box{
    width:100%;
    max-width:420px;

    padding:30px;

    border-radius:25px;

    background:
        rgba(20,27,48,.90);

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(15px);

    -webkit-backdrop-filter:
        blur(15px);
}

.logo{
    width:75px;
    height:75px;

    margin:
        0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;

    font-size:25px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    box-shadow:
        0 10px 35px
        rgba(120,70,255,.45);
}

h1{
    text-align:center;

    font-size:25px;

    margin-bottom:7px;
}

.subtitle{
    text-align:center;

    color:#aab3c8;

    font-size:14px;

    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;

    font-size:13px;

    color:#cbd2e5;

    margin-bottom:7px;
}

input{
    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid
        #303b59;

    background:#0d1324;

    color:#fff;

    outline:none;

    font-size:15px;
}

input:focus{
    border-color:#805cff;

    box-shadow:
        0 0 0 3px
        rgba(128,92,255,.12);
}

button{
    width:100%;

    padding:15px;

    border:0;

    border-radius:14px;

    color:#fff;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #6855ff,
            #b14cff
        );

    box-shadow:
        0 10px 30px
        rgba(108,80,255,.30);
}

button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

.message{
    display:none;

    margin-bottom:15px;

    padding:12px;

    border-radius:12px;

    font-size:13px;

    line-height:1.5;

    text-align:center;
}

.message.error{
    display:block;

    background:
        rgba(255,60,80,.12);

    border:
        1px solid
        rgba(255,60,80,.25);

    color:#ff9ba6;
}

.message.success{
    display:block;

    background:
        rgba(50,220,130,.12);

    border:
        1px solid
        rgba(50,220,130,.25);

    color:#79efad;
}

.message.info{
    display:block;

    background:
        rgba(80,140,255,.12);

    border:
        1px solid
        rgba(80,140,255,.25);

    color:#9ec4ff;
}

.loading{
    display:none;

    margin-top:15px;

    text-align:center;

    color:#b9c2d8;

    font-size:13px;
}

.loading.show{
    display:block;
}

.switch{
    text-align:center;

    margin-top:20px;

    font-size:13px;

    color:#aab3c8;
}

.switch span{
    color:#a88cff;

    cursor:pointer;

    font-weight:bold;
}

.register-fields{
    display:none;
}

.register-fields.show{
    display:block;
}

.status-box{
    display:none;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:#9da8c2;

    font-size:11px;

    line-height:1.6;

    word-break:break-word;
}

.status-box.show{
    display:block;
}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .login-box{
        padding:24px 20px;

        border-radius:22px;
    }

    .logo{
        width:68px;
        height:68px;

        font-size:22px;
    }

    h1{
        font-size:23px;
    }

}

</style>
</head>


<body>


<div class="login-box">

    <div class="logo">
        MB
    </div>


    <h1 id="title">
        Login
    </h1>


    <div class="subtitle">
        MultiBooster Media
    </div>


    <div
        id="message"
        class="message">
    </div>


    <form id="authForm">


        <!-- REGISTER -->

        <div
            id="registerFields"
            class="register-fields">


            <div class="form-group">

                <label>
                    Nama
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Nama lengkap"
                    autocomplete="name">

            </div>


            <div class="form-group">

                <label>
                    Nomor WhatsApp
                </label>

                <input
                    id="phone"
                    type="tel"
                    placeholder="08xxxxxxxxxx"
                    autocomplete="tel">

            </div>


        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="email@gmail.com"
                autocomplete="email"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required>

        </div>


        <button
            id="submitBtn"
            type="submit">

            Login

        </button>


    </form>


    <div
        id="loading"
        class="loading">

        Memproses login...

    </div>


    <div
        id="statusBox"
        class="status-box">
    </div>


    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>


</div>



<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    setPersistence,
    browserLocalPersistence,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";



/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"
};



/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getFirestore(app);



/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById("authForm");


const emailInput =
    document.getElementById("email");


const passwordInput =
    document.getElementById("password");


const nameInput =
    document.getElementById("name");


const phoneInput =
    document.getElementById("phone");


const registerFields =
    document.getElementById("registerFields");


const submitBtn =
    document.getElementById("submitBtn");


const switchText =
    document.getElementById("switchText");


const title =
    document.getElementById("title");


const message =
    document.getElementById("message");


const loading =
    document.getElementById("loading");


const statusBox =
    document.getElementById("statusBox");



/* =====================================================
   VARIABLES
===================================================== */

let registerMode =
    false;


let redirecting =
    false;



/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="error"
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}



function hideMessage(){

    message.style.display =
        "none";
}



/* =====================================================
   LOADING
===================================================== */

function setLoading(
    active,
    text="Memproses..."
){

    submitBtn.disabled =
        active;

    loading.textContent =
        text;

    loading.classList.toggle(
        "show",
        active
    );
}



/* =====================================================
   DEBUG STATUS
===================================================== */

function status(
    text
){

    console.log(
        "[MultiBooster]",
        text
    );

    statusBox.textContent =
        text;

    statusBox.classList.add(
        "show"
    );
}



/* =====================================================
   REDIRECT
===================================================== */

function redirectTo(
    page
){

    console.log(
        "REDIRECT KE:",
        page
    );


    status(
        "Membuka " + page
    );


    /*
      location.replace membuat halaman
      login tidak kembali ketika tombol
      Back ditekan.
    */

    window.location.replace(
        "./" + page
    );
}



/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(
    user
){

    console.log(
        "--------------------------------"
    );

    console.log(
        "MEMERIKSA STATUS ADMIN"
    );

    console.log(
        "UID:",
        user.uid
    );


    status(
        "Memeriksa akun admin..."
    );


    /*
      Dokumen admin harus:

      admins/{UID}

      contoh:

      admins/
      WwWSSJ0oGlaEh0ylexszH2Z5lZN2
    */

    const adminRef =
        doc(
            db,
            "admins",
            user.uid
        );


    let snapshot;


    try{

        snapshot =
            await getDoc(
                adminRef
            );

    }catch(error){

        console.error(
            "GAGAL MEMBACA ADMIN:",
            error
        );


        throw new Error(
            "Tidak dapat membaca data admin. Periksa Firestore Rules."
        );
    }


    console.log(
        "DOKUMEN ADMIN ADA:",
        snapshot.exists()
    );


    if(
        !snapshot.exists()
    ){

        status(
            "Dokumen admin tidak ditemukan. Melanjutkan sebagai user..."
        );


        return false;
    }


    const data =
        snapshot.data();


    console.log(
        "DATA ADMIN:",
        data
    );


    console.log(
        "ROLE:",
        data.role
    );


    console.log(
        "ACTIVE:",
        data.active
    );


    const roleOK =
        data.role === "admin";


    const activeOK =
        data.active === true;


    console.log(
        "ROLE OK:",
        roleOK
    );


    console.log(
        "ACTIVE OK:",
        activeOK
    );


    if(
        roleOK &&
        activeOK
    ){

        status(
            "Admin terdeteksi."
        );


        return true;
    }


    status(
        "Dokumen ditemukan tetapi bukan admin aktif."
    );


    return false;
}



/* =====================================================
   CHECK USER
===================================================== */

async function checkBlocked(
    user
){

    status(
        "Memeriksa status akun..."
    );


    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    let snapshot;


    try{

        snapshot =
            await getDoc(
                userRef
            );

    }catch(error){

        console.error(
            "GAGAL MEMBACA USER:",
            error
        );


        throw new Error(
            "Tidak dapat membaca data akun user."
        );
    }


    if(
        !snapshot.exists()
    ){

        return false;
    }


    const data =
        snapshot.data();


    return data.isBlocked === true;
}



/* =====================================================
   PROCESS USER
===================================================== */

async function processUser(
    user
){

    if(
        !user
    ){

        return;
    }


    if(
        redirecting
    ){

        return;
    }


    redirecting =
        true;


    setLoading(
        true,
        "Memeriksa akun..."
    );


    try{

        console.log(
            "================================"
        );

        console.log(
            "USER LOGIN"
        );

        console.log(
            "EMAIL:",
            user.email
        );

        console.log(
            "UID:",
            user.uid
        );


        /* =============================================
           ADMIN CHECK
        ============================================= */

        const admin =
            await checkAdmin(
                user
            );


        if(
            admin
        ){

            console.log(
                "================================"
            );

            console.log(
                "STATUS: ADMIN"
            );

            console.log(
                "REDIRECT: admin.html"
            );


            showMessage(
                "Login admin berhasil. Membuka panel admin...",
                "success"
            );


            setLoading(
                true,
                "Membuka panel admin..."
            );


            /*
              Redirect langsung.
            */

            redirectTo(
                "admin.html"
            );


            return;
        }


        /* =============================================
           USER CHECK
        ============================================= */

        const blocked =
            await checkBlocked(
                user
            );


        if(
            blocked
        ){

            console.log(
                "STATUS: BLOCKED"
            );


            await signOut(
                auth
            );


            redirecting =
                false;


            setLoading(
                false
            );


            showMessage(
                "Akun Anda telah diblokir.",
                "error"
            );


            return;
        }


        /* =============================================
           NORMAL USER
        ============================================= */

        console.log(
            "================================"
        );

        console.log(
            "STATUS: USER"
        );

        console.log(
            "REDIRECT: dashboard.html"
        );


        showMessage(
            "Login berhasil. Membuka dashboard...",
            "success"
        );


        setLoading(
            true,
            "Membuka dashboard..."
        );


        redirectTo(
            "dashboard.html"
        );

    }catch(error){

        console.error(
            "PROCESS USER ERROR:",
            error
        );


        redirecting =
            false;


        setLoading(
            false
        );


        showMessage(
            error.message ||
            "Terjadi kesalahan.",
            "error"
        );
    }
}



/* =====================================================
   FIREBASE PERSISTENCE
===================================================== */

try{

    await setPersistence(
        auth,
        browserLocalPersistence
    );

    console.log(
        "Firebase persistence aktif."
    );

}catch(error){

    console.error(
        "Persistence error:",
        error
    );
}



/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
            ? user.uid
            : "BELUM LOGIN"
        );


        /*
          Jika sudah login sebelumnya,
          proses otomatis.

          Tidak membutuhkan klik.
        */

        if(
            user &&
            !redirecting
        ){

            await processUser(
                user
            );
        }

    }
);



/* =====================================================
   LOGIN / REGISTER
===================================================== */

form.addEventListener(
    "submit",
    async(event)=>{

        event.preventDefault();


        if(
            redirecting
        ){

            return;
        }


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        hideMessage();


        setLoading(
            true,
            registerMode
            ? "Membuat akun..."
            : "Login..."
        );


        try{


            /* =========================================
               REGISTER
            ========================================= */

            if(
                registerMode
            ){

                const name =
                    nameInput.value.trim();


                const phone =
                    phoneInput.value.trim();


                if(
                    !name
                ){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(
                    !phone
                ){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                console.log(
                    "MEMBUAT AKUN..."
                );


                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                console.log(
                    "AKUN BERHASIL DIBUAT"
                );


                console.log(
                    "UID:",
                    user.uid
                );


                status(
                    "Menyimpan profil user..."
                );


                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        role:
                            "user",

                        createdAt:
                            serverTimestamp()

                    }
                );


                redirecting =
                    true;


                showMessage(
                    "Pendaftaran berhasil. Membuka dashboard...",
                    "success"
                );


                setLoading(
                    true,
                    "Membuka dashboard..."
                );


                redirectTo(
                    "dashboard.html"
                );


                return;
            }



            /* =========================================
               LOGIN
            ========================================= */

            console.log(
                "LOGIN DIMULAI..."
            );


            status(
                "Menghubungkan ke Firebase..."
            );


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "LOGIN BERHASIL."
            );


            console.log(
                "UID:",
                user.uid
            );


            console.log(
                "EMAIL:",
                user.email
            );


            /*
              LANGSUNG PROSES.

              Tidak menunggu klik.
            */

            await processUser(
                user
            );


        }catch(error){

            console.error(
                "AUTH ERROR:",
                error
            );


            redirecting =
                false;


            setLoading(
                false
            );


            let text =
                "Login gagal.";


            switch(
                error.code
            ){

                case "auth/invalid-credential":

                    text =
                        "Email atau password salah.";

                    break;


                case "auth/user-not-found":

                    text =
                        "Akun tidak ditemukan.";

                    break;


                case "auth/wrong-password":

                    text =
                        "Password salah.";

                    break;


                case "auth/invalid-email":

                    text =
                        "Format email tidak valid.";

                    break;


                case "auth/email-already-in-use":

                    text =
                        "Email sudah terdaftar.";

                    break;


                case "auth/weak-password":

                    text =
                        "Password minimal 6 karakter.";

                    break;


                case "auth/too-many-requests":

                    text =
                        "Terlalu banyak percobaan login. Coba lagi nanti.";

                    break;


                case "permission-denied":

                    text =
                        "Firestore Rules menolak akses.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        text =
                            error.message;
                    }

            }


            showMessage(
                text,
                "error"
            );
        }

    }
);



/* =====================================================
   SWITCH LOGIN / REGISTER
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
            !registerMode;


        if(
            registerMode
        ){

            title.textContent =
                "Daftar Akun";


            registerFields.classList.add(
                "show"
            );


            submitBtn.textContent =
                "Daftar";


            switchText.textContent =
                "Sudah punya akun? Login";


            passwordInput.autocomplete =
                "new-password";


        }else{

            title.textContent =
                "Login";


            registerFields.classList.remove(
                "show"
            );


            submitBtn.textContent =
                "Login";


            switchText.textContent =
                "Belum punya akun? Daftar";


            passwordInput.autocomplete =
                "current-password";

        }

    }
);

</script>

</body>
</html>

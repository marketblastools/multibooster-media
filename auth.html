<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Masuk / Daftar Akun - MultiBooster</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #07111f,
          #101d35
        );

      color: #fff;

      display: flex;

      justify-content: center;

      align-items: center;

      min-height: 100vh;

      margin: 0;

      padding: 15px;

    }


    .auth-box {

      width: 100%;

      max-width: 380px;

      background: #0d1d30;

      border: 1px solid
        rgba(255,255,255,0.08);

      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 20px 50px
        rgba(0,0,0,0.5);

    }


    .logo {

      text-align: center;

      font-size: 24px;

      font-weight: bold;

      margin-bottom: 5px;

      color: #00d4ff;

    }


    .subtitle {

      text-align: center;

      color: #8ea2bd;

      font-size: 12px;

      margin-bottom: 25px;

    }


    h3 {

      text-align: center;

      font-size: 18px;

      margin-bottom: 18px;

    }


    .form-group {

      margin-bottom: 13px;

    }


    label {

      display: block;

      color: #8ea2bd;

      font-size: 12px;

      margin-bottom: 6px;

    }


    input {

      width: 100%;

      padding: 12px;

      background: #050d18;

      border: 1px solid
        rgba(255,255,255,0.1);

      border-radius: 8px;

      color: #fff;

      outline: none;

      font-size: 14px;

    }


    input:focus {

      border-color: #00d4ff;

    }


    button {

      width: 100%;

      padding: 12px;

      border: none;

      border-radius: 8px;

      background:
        linear-gradient(
          135deg,
          #00bfe9,
          #6857ff
        );

      color: #fff;

      font-weight: bold;

      cursor: pointer;

      font-size: 14px;

      margin-top: 5px;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .toggle-link {

      text-align: center;

      margin-top: 15px;

      font-size: 12px;

      color: #00d4ff;

      cursor: pointer;

    }


    .message {

      display: none;

      padding: 10px;

      border-radius: 8px;

      margin-bottom: 15px;

      font-size: 12px;

      text-align: center;

    }


    .message.error {

      display: block;

      background: rgba(255,82,82,0.12);

      color: #ff7777;

      border: 1px solid
        rgba(255,82,82,0.25);

    }


    .message.success {

      display: block;

      background: rgba(39,232,137,0.12);

      color: #27e889;

      border: 1px solid
        rgba(39,232,137,0.25);

    }


    .password-info {

      color: #687d98;

      font-size: 10px;

      margin-top: 5px;

    }

  </style>

</head>


<body>


<div class="auth-box">

  <div class="logo">
    MULTIBOOSTER
  </div>

  <div class="subtitle">
    Partnership Global Media
  </div>


  <!-- PESAN -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ==================================
       LOGIN
  =================================== -->

  <form
    id="login-form"
  >

    <h3>
      Masuk Akun
    </h3>


    <div class="form-group">

      <label>
        Email
      </label>

      <input
        type="email"
        id="login-email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="login-password"
        placeholder="Masukkan password"
        autocomplete="current-password"
        required
      >

    </div>


    <button
      type="submit"
      id="login-button"
    >
      Masuk
    </button>


    <p
      class="toggle-link"
      onclick="showRegister()"
    >
      Belum punya akun? Daftar
    </p>

  </form>


  <!-- ==================================
       REGISTER
  =================================== -->

  <form
    id="register-form"
    style="display:none;"
  >

    <h3>
      Daftar Akun Baru
    </h3>


    <div class="form-group">

      <label>
        Nama Lengkap
      </label>

      <input
        type="text"
        id="reg-name"
        placeholder="Nama lengkap"
        autocomplete="name"
        required
      >

    </div>


    <div class="form-group">

      <label>
        Nomor Telepon
      </label>

      <input
        type="tel"
        id="reg-phone"
        placeholder="08xxxxxxxxxx"
        autocomplete="tel"
        required
      >

    </div>


    <div class="form-group">

      <label>
        Email
      </label>

      <input
        type="email"
        id="reg-email"
        placeholder="Masukkan email"
        autocomplete="email"
        required
      >

    </div>


    <div class="form-group">

      <label>
        Password
      </label>

      <input
        type="password"
        id="reg-password"
        placeholder="Minimal 6 karakter"
        autocomplete="new-password"
        minlength="6"
        required
      >

      <div class="password-info">
        Password minimal 6 karakter.
      </div>

    </div>


    <div class="form-group">

      <label>
        Konfirmasi Password
      </label>

      <input
        type="password"
        id="reg-confirm"
        placeholder="Ulangi password"
        autocomplete="new-password"
        minlength="6"
        required
      >

    </div>


    <button
      type="submit"
      id="register-button"
    >
      Daftar
    </button>


    <p
      class="toggle-link"
      onclick="showLogin()"
    >
      Sudah punya akun? Masuk
    </p>

  </form>

</div>


<!-- ==========================================
     FIREBASE
=========================================== -->

<script type="module">


  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


  import {

    getAuth,

    createUserWithEmailAndPassword,

    signInWithEmailAndPassword,

    onAuthStateChanged

  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";


  import {

    getFirestore,

    doc,

    setDoc,

    getDoc

  } from
  "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


  /* ==========================================
     FIREBASE CONFIG
     PROJECT: multibooster-media
  ========================================== */


  const firebaseConfig = {

    apiKey:
      "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
      "multibooster-media.firebaseapp.com",

    projectId:
      "multibooster-media",

    storageBucket:
      "multibooster-media.firebasestorage.app",

    messagingSenderId:
      "455058483621",

    appId:
      "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
      "G-Z9S252K9C5"

  };


  /* ==========================================
     INITIALIZE
  ========================================== */


  const app =
    initializeApp(firebaseConfig);


  const auth =
    getAuth(app);


  const db =
    getFirestore(app);


  /* ==========================================
     ELEMENT
  ========================================== */


  const loginForm =
    document.getElementById(
      "login-form"
    );


  const registerForm =
    document.getElementById(
      "register-form"
    );


  const message =
    document.getElementById(
      "message"
    );


  /* ==========================================
     PESAN
  ========================================== */


  function showMessage(
    text,
    type = "error"
  ) {

    message.textContent =
      text;

    message.className =
      "message " + type;

  }


  function clearMessage() {

    message.textContent =
      "";

    message.className =
      "message";

  }


  /* ==========================================
     GANTI FORM
  ========================================== */


  window.showRegister =
    function() {

      clearMessage();

      loginForm.style.display =
        "none";

      registerForm.style.display =
        "block";

    };


  window.showLogin =
    function() {

      clearMessage();

      registerForm.style.display =
        "none";

      loginForm.style.display =
        "block";

    };


  /* ==========================================
     REGISTER
  ========================================== */


  registerForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const name =
        document.getElementById(
          "reg-name"
        ).value.trim();


      const phone =
        document.getElementById(
          "reg-phone"
        ).value.trim();


      const email =
        document.getElementById(
          "reg-email"
        ).value.trim();


      const password =
        document.getElementById(
          "reg-password"
        ).value;


      const confirm =
        document.getElementById(
          "reg-confirm"
        ).value;


      if (password !== confirm) {

        showMessage(
          "Konfirmasi password tidak sama."
        );

        return;

      }


      if (password.length < 6) {

        showMessage(
          "Password minimal 6 karakter."
        );

        return;

      }


      const button =
        document.getElementById(
          "register-button"
        );


      button.disabled =
        true;

      button.textContent =
        "Mendaftarkan...";


      try {


        /* ==============================
           BUAT AKUN FIREBASE AUTH
        ============================== */


        const credential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        /* ==============================
           BUAT DATA USER DI FIRESTORE

           Password TIDAK disimpan.
        ============================== */


        await setDoc(

          doc(
            db,
            "users",
            user.uid
          ),

          {

            uid:
              user.uid,

            name:
              name,

            email:
              email,

            phone:
              phone,

            balance:
              0,

            isBlocked:
              false,

            photoURL:
              "",

            createdAt:
              new Date()

          }

        );


        showMessage(
          "Pendaftaran berhasil! Mengarahkan ke dashboard...",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
              "dashboard.html";

          },
          1000
        );


      } catch (error) {


        console.error(
          "REGISTER ERROR:",
          error
        );


        let text =
          "Pendaftaran gagal.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          text =
            "Email tersebut sudah terdaftar.";

        }


        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          text =
            "Format email tidak valid.";

        }


        else if (
          error.code ===
          "auth/weak-password"
        ) {

          text =
            "Password terlalu lemah.";

        }


        else if (
          error.code ===
          "auth/configuration-not-found"
        ) {

          text =
            "Firebase Authentication belum dikonfigurasi.";

        }


        else {

          text +=
            " " +
            error.message;

        }


        showMessage(
          text
        );


        button.disabled =
          false;

        button.textContent =
          "Daftar";

      }

    }
  );


  /* ==========================================
     LOGIN
  ========================================== */


  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      clearMessage();


      const email =
        document.getElementById(
          "login-email"
        ).value.trim();


      const password =
        document.getElementById(
          "login-password"
        ).value;


      const button =
        document.getElementById(
          "login-button"
        );


      button.disabled =
        true;

      button.textContent =
        "Memeriksa...";


      try {


        /* ==============================
           LOGIN FIREBASE AUTH
        ============================== */


        const credential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          credential.user;


        /* ==============================
           CEK DATA FIRESTORE
        ============================== */


        const userRef =
          doc(
            db,
            "users",
            user.uid
          );


        const userSnap =
          await getDoc(
            userRef
          );


        if (
          userSnap.exists()
        ) {

          const userData =
            userSnap.data();


          /* CEK BLOKIR */

          if (
            userData.isBlocked === true
          ) {

            showMessage(
              "Akun Anda telah diblokir oleh admin."
            );


            await auth.signOut();

            button.disabled =
              false;

            button.textContent =
              "Masuk";

            return;

          }

        }


        showMessage(
          "Login berhasil! Mengarahkan...",
          "success"
        );


        setTimeout(
          () => {

            window.location.href =
              "dashboard.html";

          },
          500
        );


      } catch (error) {


        console.error(
          "LOGIN ERROR:",
          error
        );


        let text =
          "Login gagal.";


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          text =
            "Email atau password salah.";

        }


        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          text =
            "Akun dengan email tersebut tidak ditemukan.";

        }


        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          text =
            "Password salah.";

        }


        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          text =
            "Terlalu banyak percobaan. Coba lagi nanti.";

        }


        else if (
          error.code ===
          "auth/configuration-not-found"
        ) {

          text =
            "Firebase Authentication belum dikonfigurasi.";

        }


        else {

          text +=
            " " +
            error.message;

        }


        showMessage(
          text
        );


        button.disabled =
          false;

        button.textContent =
          "Masuk";

      }

    }
  );


  /* ==========================================
     CEK STATUS AUTH
  ========================================== */


  onAuthStateChanged(
    auth,
    (user) => {

      /*
       * Jika user sudah login dan membuka
       * auth.html lagi, langsung ke dashboard.
       */

      if (user) {

        console.log(
          "User sudah login:",
          user.email
        );

      }

    }
  );


</script>

</body>
</html>

<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Masuk / Daftar - MultiBooster Media</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at top left, rgba(0,212,255,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(104,87,255,.20), transparent 35%),
        #050b14;
    }

    .auth-box {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(13,29,48,.94);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 25px 70px rgba(0,0,0,.55);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 900;
      background: linear-gradient(135deg,#00d4ff,#6857ff);
      box-shadow: 0 12px 35px rgba(0,212,255,.25);
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 21px;
    }

    .subtitle {
      text-align: center;
      color: #8ea2bd;
      font-size: 12px;
      margin: 8px 0 25px;
    }

    .form-title {
      font-size: 17px;
      margin-bottom: 16px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 13px;
    }

    label {
      display: block;
      font-size: 11px;
      color: #8ea2bd;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,.09);
      outline: none;
      background: #050d18;
      color: #fff;
      font-size: 14px;
    }

    input:focus {
      border-color: #00d4ff;
      box-shadow: 0 0 0 3px rgba(0,212,255,.08);
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      background: linear-gradient(135deg,#00bfe9,#6857ff);
      margin-top: 5px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .switch {
      text-align: center;
      margin-top: 18px;
      color: #8ea2bd;
      font-size: 12px;
    }

    .switch span {
      color: #00d4ff;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 12px;
      color: #00d4ff;
      font-size: 12px;
    }

    .loading.show {
      display: block;
    }

    .info {
      margin-top: 18px;
      padding: 10px;
      border-radius: 9px;
      background: rgba(0,212,255,.05);
      border: 1px solid rgba(0,212,255,.10);
      color: #8ea2bd;
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }
  </style>

</head>

<body>

<div class="auth-box">

  <div class="logo">MB</div>

  <h2>MultiBooster Media</h2>

  <div class="subtitle">
    Panel digital marketing & social media
  </div>

  <!-- ================= LOGIN ================= -->

  <form id="login-form">


<div class="form-title">
  Masuk ke Akun
</div>

<div class="input-group">
  <label>Email</label>
  <input
    type="email"
    id="login-email"
    placeholder="Masukkan email"
    autocomplete="email"
    required
  >
</div>

<div class="input-group">
  <label>Password</label>
  <input
    type="password"
    id="login-password"
    placeholder="Masukkan password"
    autocomplete="current-password"
    required
  >
</div>

<button
  type="submit"
  class="btn"
  id="login-button"
>
  Masuk
</button>

<div class="loading" id="login-loading">
  Memeriksa akun...
</div>

<div class="switch">
  Belum punya akun?
  <span onclick="showRegister()">Daftar sekarang</span>
</div>


  </form>

  <!-- ================= REGISTER ================= -->

  <form id="register-form" class="hidden">


<div class="form-title">
  Buat Akun Baru
</div>

<div class="input-group">
  <label>Nama Lengkap</label>
  <input
    type="text"
    id="reg-name"
    placeholder="Nama lengkap"
    required
  >
</div>

<div class="input-group">
  <label>Nomor Telepon</label>
  <input
    type="tel"
    id="reg-phone"
    placeholder="08xxxxxxxxxx"
    required
  >
</div>

<div class="input-group">
  <label>Email</label>
  <input
    type="email"
    id="reg-email"
    placeholder="nama@email.com"
    autocomplete="email"
    required
  >
</div>

<div class="input-group">
  <label>Password</label>
  <input
    type="password"
    id="reg-password"
    placeholder="Minimal 6 karakter"
    autocomplete="new-password"
    minlength="6"
    required
  >
</div>

<div class="input-group">
  <label>Konfirmasi Password</label>
  <input
    type="password"
    id="reg-confirm"
    placeholder="Ulangi password"
    autocomplete="new-password"
    minlength="6"
    required
  >
</div>

<button
  type="submit"
  class="btn"
  id="register-button"
>
  Daftar
</button>

<div class="loading" id="register-loading">
  Membuat akun...
</div>

<div class="switch">
  Sudah punya akun?
  <span onclick="showLogin()">Masuk</span>
</div>


  </form>

  <div class="info">
    Akun Anda menggunakan Firebase Authentication.
    Saldo dan data akun disimpan di Firestore.
  </div>

</div>

<script type="module">

  /* =====================================================
     FIREBASE
  ===================================================== */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


  /* =====================================================
     CONFIG PROJECT MULTIBOOSTER-MEDIA
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
      "multibooster-media.firebaseapp.com",

    projectId:
      "multibooster-media",

    storageBucket:
      "multibooster-media.firebasestorage.app",

    messagingSenderId:
      "455058483621",

    appId:
      "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
      "G-Z9S252K9C5"

  };


  /* =====================================================
     INITIALIZE
  ===================================================== */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* =====================================================
     FORM
  ===================================================== */

  const loginForm =
    document.getElementById("login-form");

  const registerForm =
    document.getElementById("register-form");


  /* =====================================================
     SWITCH FORM
  ===================================================== */

  window.showRegister = function() {

    loginForm.classList.add("hidden");

    registerForm.classList.remove("hidden");

  };


  window.showLogin = function() {

    registerForm.classList.add("hidden");

    loginForm.classList.remove("hidden");

  };


  /* =====================================================
     REGISTER
  ===================================================== */

  registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const name =
      document.getElementById("reg-name").value.trim();

    const phone =
      document.getElementById("reg-phone").value.trim();

    const email =
      document.getElementById("reg-email").value.trim();

    const password =
      document.getElementById("reg-password").value;

    const confirm =
      document.getElementById("reg-confirm").value;


    if (password !== confirm) {

      alert("Konfirmasi password tidak sama.");

      return;

    }


    if (password.length < 6) {

      alert("Password minimal 6 karakter.");

      return;

    }


    const button =
      document.getElementById("register-button");

    const loading =
      document.getElementById("register-loading");


    button.disabled = true;

    loading.classList.add("show");


    try {

      /*
       * Buat akun melalui Firebase Authentication.
       */

      const credential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      /*
       * Buat data user di Firestore.
       *
       * Document ID = UID Firebase Authentication
       */

      await setDoc(
        doc(db, "users", user.uid),
        {

          uid: user.uid,

          name: name,

          phone: phone,

          email: user.email,

          balance: 0,

          isBlocked: false,

          role: "user",

          createdAt: serverTimestamp()

        }
      );


      alert(
        "Pendaftaran berhasil. Selamat datang!"
      );


      /*
       * User baru langsung diarahkan
       * ke dashboard.
       */

      window.location.href =
        "dashboard.html";


    } catch (error) {

      console.error(
        "Register error:",
        error
      );


      let message =
        "Pendaftaran gagal.";


      if (
        error.code ===
        "auth/email-already-in-use"
      ) {

        message =
          "Email tersebut sudah terdaftar.";

      }

      else if (
        error.code ===
        "auth/invalid-email"
      ) {

        message =
          "Format email tidak valid.";

      }

      else if (
        error.code ===
        "auth/weak-password"
      ) {

        message =
          "Password terlalu lemah.";

      }

      else if (
        error.code ===
        "permission-denied"
      ) {

        message =
          "Firebase menolak akses Firestore. Periksa Firestore Rules.";

      }


      alert(message);

    }


    button.disabled = false;

    loading.classList.remove("show");

  });


  /* =====================================================
     LOGIN
  ===================================================== */

  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();


    const email =
      document.getElementById("login-email")
        .value
        .trim();

    const password =
      document.getElementById("login-password")
        .value;


    const button =
      document.getElementById("login-button");

    const loading =
      document.getElementById("login-loading");


    button.disabled = true;

    loading.classList.add("show");


    try {

      /*
       * Login menggunakan Firebase Authentication.
       */

      const credential =
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        credential.user;


      /*
       * Setelah berhasil login,
       * cek apakah UID terdapat
       * di collection admins.
       */

      const adminRef =
        doc(
          db,
          "admins",
          user.uid
        );


      const adminSnap =
        await getDoc(adminRef);


      /* =================================================
         ADMIN
      ================================================= */

      if (adminSnap.exists()) {

        const adminData =
          adminSnap.data();


        if (
          adminData.active === true &&
          adminData.role === "admin"
        ) {

          alert(
            "Login admin berhasil."
          );


          window.location.href =
            "admin.html";


          return;

        }

      }


      /* =================================================
         USER BIASA
      ================================================= */

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if (userSnap.exists()) {

        const userData =
          userSnap.data();


        if (userData.isBlocked === true) {

          alert(
            "Akun Anda telah diblokir oleh admin."
          );

          return;

        }

      }


      alert(
        "Login berhasil."
      );


      window.location.href =
        "dashboard.html";


    } catch (error) {

      console.error(
        "Login error:",
        error
      );


      let message =
        "Login gagal.";


      if (
        error.code ===
        "auth/invalid-credential"
      ) {

        message =
          "Email atau password salah.";

      }

      else if (
        error.code ===
        "auth/user-not-found"
      ) {

        message =
          "Akun tidak ditemukan.";

      }

      else if (
        error.code ===
        "auth/wrong-password"
      ) {

        message =
          "Password salah.";

      }

      else if (
        error.code ===
        "auth/too-many-requests"
      ) {

        message =
          "Terlalu banyak percobaan. Coba lagi nanti.";

      }

      else if (
        error.code ===
        "permission-denied"
      ) {

        message =
          "Tidak memiliki izin membaca data admin. Periksa Firestore Rules.";

      }

      alert(message);

    }


    button.disabled = false;

    loading.classList.remove("show");

  });


  /* =====================================================
     CEK JIKA SUDAH LOGIN
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function(user) {

      if (!user) {
        return;
      }


      /*
       * Jangan otomatis redirect ketika halaman
       * baru dibuka setelah user sedang login.
       *
       * Kita hanya menjalankan pemeriksaan jika
       * URL memang auth.html dan user sudah login.
       */


      try {

        const adminRef =
          doc(
            db,
            "admins",
            user.uid
          );


        const adminSnap =
          await getDoc(adminRef);


        if (adminSnap.exists()) {

          const data =
            adminSnap.data();


          if (
            data.active === true &&
            data.role === "admin"
          ) {

            /*
             * Jika admin sudah login
             * dan membuka auth.html,
             * arahkan ke admin.
             */

            window.location.href =
              "admin.html";

            return;

          }

        }

      } catch (error) {

        console.error(
          "Pemeriksaan admin gagal:",
          error
        );

      }

    }

  );

</script>

</body>
</html>

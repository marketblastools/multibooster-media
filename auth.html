<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - MultiBooster Media</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at top left,#263b70 0%,transparent 35%),
        radial-gradient(circle at bottom right,#531b5d 0%,transparent 35%),
        linear-gradient(135deg,#070b18,#11182c,#080b16);
    color:white;
}

.login-box{
    width:100%;
    max-width:420px;
    padding:30px;
    border-radius:25px;
    background:rgba(20,27,48,.88);
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 25px 70px rgba(0,0,0,.5);
    backdrop-filter:blur(15px);
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;
    border-radius:22px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:25px;
    font-weight:bold;
    background:linear-gradient(135deg,#6d5dfc,#b44cff);
    box-shadow:0 10px 35px rgba(120,70,255,.45);
}

h1{
    text-align:center;
    font-size:25px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#aab3c8;
    font-size:14px;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    color:#cbd2e5;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px 15px;
    border-radius:13px;
    border:1px solid #303b59;
    background:#0d1324;
    color:white;
    outline:none;
    font-size:15px;
}

input:focus{
    border-color:#805cff;
    box-shadow:0 0 0 3px rgba(128,92,255,.12);
}

button{
    width:100%;
    border:0;
    padding:15px;
    border-radius:14px;
    font-size:15px;
    font-weight:bold;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#6855ff,#b14cff);
    box-shadow:0 10px 30px rgba(108,80,255,.3);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-bottom:15px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    text-align:center;
}

.error{
    background:rgba(255,60,80,.12);
    border:1px solid rgba(255,60,80,.25);
    color:#ff9ba6;
}

.success{
    background:rgba(50,220,130,.12);
    border:1px solid rgba(50,220,130,.25);
    color:#79efad;
}

.switch{
    text-align:center;
    margin-top:20px;
    font-size:13px;
    color:#aab3c8;
}

.switch span{
    color:#a88cff;
    cursor:pointer;
    font-weight:bold;
}

.loading{
    text-align:center;
    display:none;
    margin-top:15px;
    color:#b9c2d8;
    font-size:13px;
}

.register-fields{
    display:none;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">MB</div>

    <h1 id="title">Login</h1>

    <div class="subtitle">
        MultiBooster Media
    </div>

    <div id="message" class="message"></div>

    <form id="authForm">

        <div class="register-fields" id="registerFields">

            <div class="form-group">
                <label>Nama</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Nama lengkap"
                >
            </div>

            <div class="form-group">
                <label>Nomor WhatsApp</label>

                <input
                    type="tel"
                    id="phone"
                    placeholder="08xxxxxxxxxx"
                >
            </div>

        </div>

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="email@gmail.com"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

        </div>

        <button
            type="submit"
            id="submitBtn">
            Login
        </button>

    </form>

    <div
        class="loading"
        id="loading">
        Memproses...
    </div>

    <div class="switch">

        <span id="switchText">
            Belum punya akun? Daftar
        </span>

    </div>

</div>


<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyCpz9IDhA9b3sVzbIL2DOsy5hpfoPHFVNA",

    authDomain:
        "multibooster-media.firebaseapp.com",

    projectId:
        "multibooster-media",

    storageBucket:
        "multibooster-media.firebasestorage.app",

    messagingSenderId:
        "455058483621",

    appId:
        "1:455058483621:web:7a969f17fdae000588204c",

    measurementId:
        "G-Z9S252K9C5"
};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENT
===================================================== */

const form =
    document.getElementById("authForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const nameInput =
    document.getElementById("name");

const phoneInput =
    document.getElementById("phone");

const registerFields =
    document.getElementById("registerFields");

const submitBtn =
    document.getElementById("submitBtn");

const switchText =
    document.getElementById("switchText");

const title =
    document.getElementById("title");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");


let registerMode = false;

let redirecting = false;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="error"
){

    message.textContent =
        text;

    message.className =
        "message " + type;

    message.style.display =
        "block";
}


/* =====================================================
   LOADING
===================================================== */

function setLoading(status){

    loading.style.display =
        status
        ? "block"
        : "none";

    submitBtn.disabled =
        status;
}


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(user){

    console.log(
        "================================"
    );

    console.log(
        "MEMERIKSA ADMIN"
    );

    console.log(
        "UID:",
        user.uid
    );

    console.log(
        "EMAIL:",
        user.email
    );


    const adminRef =
        doc(
            db,
            "admins",
            user.uid
        );


    let adminSnap;

    try{

        adminSnap =
            await getDoc(adminRef);

    }catch(error){

        console.error(
            "FIRESTORE ADMIN ERROR:",
            error
        );

        throw new Error(
            "Tidak dapat membaca data admin. Periksa Firestore Rules."
        );
    }


    console.log(
        "ADMIN DOCUMENT ADA:",
        adminSnap.exists()
    );


    if(!adminSnap.exists()){

        console.log(
            "BUKAN ADMIN"
        );

        return false;
    }


    const adminData =
        adminSnap.data();


    console.log(
        "DATA ADMIN:",
        adminData
    );


    console.log(
        "ROLE:",
        adminData.role
    );

    console.log(
        "ACTIVE:",
        adminData.active
    );


    const result =
        adminData.role === "admin"
        &&
        adminData.active === true;


    console.log(
        "HASIL ADMIN:",
        result
    );


    return result;
}


/* =====================================================
   CHECK USER
===================================================== */

async function checkUser(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    try{

        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            return {
                exists:false,
                blocked:false
            };
        }


        const data =
            userSnap.data();


        return {

            exists:true,

            blocked:
                data.isBlocked === true

        };

    }catch(error){

        console.error(
            "USER CHECK ERROR:",
            error
        );

        throw new Error(
            "Tidak dapat membaca data user."
        );
    }
}


/* =====================================================
   REDIRECT
===================================================== */

async function redirectByRole(user){

    if(
        !user ||
        redirecting
    ){

        return;
    }


    redirecting = true;

    setLoading(true);


    console.log(
        "================================"
    );

    console.log(
        "REDIRECT CHECK"
    );

    console.log(
        "USER:",
        user.email
    );

    console.log(
        "UID:",
        user.uid
    );


    /* =================================================
       ADMIN
    ================================================= */

    const isAdmin =
        await checkAdmin(user);


    if(isAdmin){

        console.log(
            "ROLE TERDETEKSI: ADMIN"
        );

        console.log(
            "MENUJU admin.html"
        );


        window.location.replace(
            "./admin.html"
        );

        return;
    }


    /* =================================================
       USER
    ================================================= */

    const userData =
        await checkUser(user);


    if(userData.blocked){

        await signOut(auth);

        redirecting = false;

        setLoading(false);


        showMessage(
            "Akun Anda telah diblokir.",
            "error"
        );

        return;
    }


    console.log(
        "ROLE TERDETEKSI: USER"
    );

    console.log(
        "MENUJU dashboard.html"
    );


    window.location.replace(
        "./dashboard.html"
    );
}


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    async(user)=>{

        console.log(
            "AUTH STATE:",
            user
                ? user.email
                : "BELUM LOGIN"
        );


        if(!user){

            return;
        }


        /*
          Jika browser sudah menyimpan
          session login, langsung cek role.
        */

        try{

            await redirectByRole(user);

        }catch(error){

            console.error(
                "AUTO LOGIN ERROR:",
                error
            );

            redirecting = false;

            setLoading(false);

            showMessage(
                error.message,
                "error"
            );
        }

    }
);


/* =====================================================
   FORM SUBMIT
===================================================== */

form.addEventListener(
    "submit",
    async(e)=>{

        e.preventDefault();


        if(redirecting){

            return;
        }


        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        try{

            setLoading(true);

            message.style.display =
                "none";


            /* =========================================
               REGISTER
            ========================================= */

            if(registerMode){

                const name =
                    nameInput.value.trim();

                const phone =
                    phoneInput.value.trim();


                if(!name){

                    throw new Error(
                        "Nama wajib diisi."
                    );
                }


                if(!phone){

                    throw new Error(
                        "Nomor WhatsApp wajib diisi."
                    );
                }


                console.log(
                    "MEMBUAT AKUN..."
                );


                const credential =
                    await createUserWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                const user =
                    credential.user;


                console.log(
                    "AKUN BERHASIL DIBUAT"
                );

                console.log(
                    "UID:",
                    user.uid
                );


                await setDoc(
                    doc(
                        db,
                        "users",
                        user.uid
                    ),
                    {

                        uid:
                            user.uid,

                        name:
                            name,

                        phone:
                            phone,

                        email:
                            user.email,

                        balance:
                            0,

                        isBlocked:
                            false,

                        role:
                            "user",

                        createdAt:
                            serverTimestamp()

                    }
                );


                showMessage(
                    "Pendaftaran berhasil. Mengarahkan...",
                    "success"
                );


                await redirectByRole(user);

                return;
            }


            /* =========================================
               LOGIN
            ========================================= */

            console.log(
                "LOGIN..."
            );


            const credential =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                credential.user;


            console.log(
                "LOGIN BERHASIL"
            );


            console.log(
                "EMAIL:",
                user.email
            );


            console.log(
                "UID:",
                user.uid
            );


            /*
              LANGSUNG REDIRECT.
              Tidak perlu klik apa pun.
            */

            await redirectByRole(user);

        }catch(error){

            console.error(
                "AUTH ERROR:",
                error
            );


            redirecting = false;

            setLoading(false);


            let text =
                "Login gagal.";


            if(
                error.code ===
                "auth/invalid-credential"
            ){

                text =
                    "Email atau password salah.";

            }

            else if(
                error.code ===
                "auth/email-already-in-use"
            ){

                text =
                    "Email sudah terdaftar.";

            }

            else if(
                error.code ===
                "auth/weak-password"
            ){

                text =
                    "Password minimal 6 karakter.";

            }

            else if(
                error.code ===
                "auth/invalid-email"
            ){

                text =
                    "Format email tidak valid.";

            }

            else if(
                error.code ===
                "permission-denied"
            ){

                text =
                    "Firestore Rules menolak akses.";

            }

            else if(error.message){

                text =
                    error.message;
            }


            showMessage(
                text,
                "error"
            );
        }

    }
);


/* =====================================================
   SWITCH LOGIN / REGISTER
===================================================== */

switchText.addEventListener(
    "click",
    ()=>{

        registerMode =
            !registerMode;


        if(registerMode){

            title.textContent =
                "Daftar Akun";

            registerFields.style.display =
                "block";

            submitBtn.textContent =
                "Daftar";

            switchText.textContent =
                "Sudah punya akun? Login";

        }else{

            title.textContent =
                "Login";

            registerFields.style.display =
                "none";

            submitBtn.textContent =
                "Login";

            switchText.textContent =
                "Belum punya akun? Daftar";
        }

    }
);

</script>

</body>
</html>
